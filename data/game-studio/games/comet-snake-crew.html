<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comet Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b1c; color: #e6ecff; font: 16px/1.4 ui-monospace, Consolas, monospace; }
  main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  canvas { border: 2px solid #28335c; border-radius: 6px; image-rendering: pixelated; }
  #hud { display: flex; gap: 24px; }
</style>
</head>
<body>
<main>
  <div id="hud"><span id="score">score 0</span><span id="pace">200 ms</span><span id="status">arrow keys steer, R restarts</span></div>
  <canvas id="game" width="720" height="540"></canvas>
</main>

<!-- The Artist's part : colours and sprites, 7 rows of 7 characters, # is a filled pixel -->
<script id="theme" type="application/json">
/* THEME:START */
{
  "name": "Second Chance",
  "background": "#101827",
  "grid": "#1e2c40",
  "head": "#ff5d73",
  "body": "#4ed6b0",
  "star": "#ffe66d",
  "comet": "#69b9ff",
  "extra": "#c792ff",
  "sprites": {
    "star": [
      "...#...",
      "..###..",
      ".#####.",
      "#######",
      ".#####.",
      "..###..",
      "...#..."
    ],
    "comet": [
      "....##.",
      "...####",
      "..####.",
      "..###..",
      ".###...",
      "####...",
      "##....."
    ],
    "extra": [
      "...#...",
      "..###..",
      ".#####.",
      "#######",
      ".#####.",
      "..#.#..",
      ".#...#."
    ]
  }
}
/* THEME:END */
</script>

<!-- The Coder's part : pure game logic. No DOM, no clock, no Math.random. Runs in the browser and in QuickJS. -->
<script id="logic">
/* LOGIC:START */
const COLS = 24;
const ROWS = 18;
const START_MS = 200;
const VECTORS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

function clone(value) { return JSON.parse(JSON.stringify(value)); }
function wrap(value, size) { return (value + size) % size; }
function same(a, b) { return a.x === b.x && a.y === b.y; }

// The only source of randomness. The seed lives in the state, so a replay is identical.
function nextRandom(state) {
  state.seed = (Math.imul(state.seed, 1664525) + 1013904223) >>> 0;
  return state.seed / 4294967296;
}

function occupied(state, cell) {
  return [...state.snake, ...state.stars, ...state.comets, ...state.extras].some(item => same(item, cell));
}

// A random cell that holds nothing and is at least `distance` steps from the head.
function freeCell(state, distance = 0) {
  const head = state.snake[0];
  for (let tries = 0; tries < 500; tries++) {
    const cell = { x: Math.floor(nextRandom(state) * COLS), y: Math.floor(nextRandom(state) * ROWS) };
    if (!occupied(state, cell) && Math.abs(cell.x - head.x) + Math.abs(cell.y - head.y) >= distance) return cell;
  }
  return null;
}

function spawnStar(state) {
  const cell = freeCell(state);
  if (cell) state.stars.push(cell);
}

function spawnComet(state) {
  const cell = freeCell(state, 8);
  if (!cell) return;
  const direction = Object.values(VECTORS)[Math.floor(nextRandom(state) * 4)];
  state.comets.push({ x: cell.x, y: cell.y, dx: direction.x, dy: direction.y });
}

function spawnExtra(state, kind) {
  const cell = freeCell(state);
  if (cell) state.extras.push({ x: cell.x, y: cell.y, kind });
}

function init(seed) {
  const state = {
    snake: [{ x: 6, y: 9 }, { x: 5, y: 9 }, { x: 4, y: 9 }],
    dir: 'right',
    stars: [],
    comets: [],
    extras: [],
    score: 0,
    eaten: 0,
    tickMs: START_MS,
    ticks: 0,
    over: false,
    reason: null,
    shield: false,
    seed: (seed >>> 0) + 1,
  };
  spawnStar(state);
  spawnComet(state);
  spawnComet(state);
  return state;
}

// One tick of the game. Returns a new state and leaves `previous` untouched.
function step(previous, input) {
  if (previous.over) return previous;

  const state = clone(previous);

  if (input && VECTORS[input] && input !== OPPOSITE[state.dir]) {
    state.dir = input;
  }

  const vector = VECTORS[state.dir];
  const oldHead = state.snake[0];
  const head = {
    x: wrap(oldHead.x + vector.x, COLS),
    y: wrap(oldHead.y + vector.y, ROWS),
  };

  const oldComets = state.comets.map(comet => ({ x: comet.x, y: comet.y }));
  for (const comet of state.comets) {
    comet.x = wrap(comet.x + comet.dx, COLS);
    comet.y = wrap(comet.y + comet.dy, ROWS);
  }

  state.snake.unshift(head);

  const starIndex = state.stars.findIndex(item => same(item, head));
  const ateStar = starIndex >= 0;
  if (ateStar) {
    state.stars.splice(starIndex, 1);
    state.score += 1;
    state.eaten += 1;

    if (state.eaten % 5 === 0) {
      state.tickMs = Math.max(60, state.tickMs - 20);
      if (state.comets.length < 6) spawnComet(state);
    }
    if (state.eaten % 4 === 0) spawnExtra(state, 'shield');

    spawnStar(state);
  } else {
    state.snake.pop();
  }

  const shieldIndex = state.extras.findIndex(extra => extra.kind === 'shield' && same(extra, head));
  if (shieldIndex >= 0) {
    state.extras.splice(shieldIndex, 1);
    state.shield = true;
  }

  const cometHitIndices = [];
  for (let i = 0; i < state.comets.length; i++) {
    const comet = state.comets[i];
    const swapped = same(oldHead, comet) && same(head, oldComets[i]);
    if (same(head, comet) || swapped) cometHitIndices.push(i);
  }

  for (let i = cometHitIndices.length - 1; i >= 0; i--) {
    const index = cometHitIndices[i];
    if (state.shield) {
      state.shield = false;
      state.comets.splice(index, 1);
    } else {
      state.over = true;
      state.reason = 'comet';
      break;
    }
  }

  if (!state.over) {
    // The tail has already been removed when the snake did not grow, so
    // every remaining segment after the head is a body cell to check.
    if (state.snake.slice(1).some(segment => same(segment, head))) {
      state.over = true;
      state.reason = 'self';
    }
  }

  state.ticks += 1;
  return state;
}
/* LOGIC:END */
</script>

<!-- The Tester's bot. Reads the same state, returns an input. Add ?bot to the address to watch it play. -->
<script id="bot">
function botMove(state) {
  const key = (x, y) => x + ',' + y;
  const headNow = state.snake[0];
  const blocked = new Set(state.snake.slice(0, -1).map(cell => key(cell.x, cell.y)));
  const danger = new Set();
  for (const comet of state.comets) {
    for (let ahead = 0; ahead <= 2; ahead++) {
      danger.add(key(wrap(comet.x + comet.dx * ahead, COLS), wrap(comet.y + comet.dy * ahead, ROWS)));
    }
  }
  const moves = Object.keys(VECTORS).filter(name => name !== OPPOSITE[state.dir]);
  const next = (cell, name) => ({ x: wrap(cell.x + VECTORS[name].x, COLS), y: wrap(cell.y + VECTORS[name].y, ROWS) });
  const wanted = new Set([...state.stars, ...state.extras.filter(item => item.kind !== 'wormhole')].map(c => key(c.x, c.y)));

  // Breadth-first search to the nearest wanted cell, past the body and the comets' next cells.
  const seen = new Set([key(headNow.x, headNow.y)]);
  let frontier = moves.map(name => ({ cell: next(headNow, name), first: name }));
  while (frontier.length) {
    const after = [];
    for (const { cell, first } of frontier) {
      const id = key(cell.x, cell.y);
      if (seen.has(id) || blocked.has(id) || danger.has(id)) continue;
      seen.add(id);
      if (wanted.has(id)) return first;
      for (const name of Object.keys(VECTORS)) after.push({ cell: next(cell, name), first });
    }
    frontier = after;
  }
  // Nothing reachable : take any move that does not kill at once.
  const isOpen = name => !blocked.has(key(next(headNow, name).x, next(headNow, name).y));
  const isSafe = name => isOpen(name) && !danger.has(key(next(headNow, name).x, next(headNow, name).y));
  return moves.find(isSafe) || moves.find(isOpen) || state.dir;
}
</script>

<!-- The kit's part : draws the state and reads the keyboard. Knows nothing about the rules. -->
<script id="view">
const theme = JSON.parse(document.getElementById('theme').textContent.replace(/\/\*.*?\*\//g, ''));
const canvas = document.getElementById('game');
const paint = canvas.getContext('2d');
const query = new URLSearchParams(location.search);
const useBot = query.has('bot');
const firstSeed = Number(query.get('seed') || 7);
const CELL = canvas.width / COLS;
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
let state = init(firstSeed);
let pending = null;

function sprite(rows, cell, colour) {
  paint.fillStyle = colour;
  const pixel = CELL / rows.length;
  rows.forEach((row, y) => [...row].forEach((mark, x) => {
    if (mark === '#') paint.fillRect(cell.x * CELL + x * pixel, cell.y * CELL + y * pixel, Math.ceil(pixel), Math.ceil(pixel));
  }));
}

// A fixed sky : the same points on every frame, so the background does not flicker.
const SKY = Array.from({ length: 90 }, (_, index) => ({
  x: (index * 97 + 13) % canvas.width, y: (index * 61 + 29) % canvas.height, size: 1 + index % 3, alpha: 0.25 + (index % 5) / 8,
}));

function glow(colour, reach, action) {
  paint.save();
  paint.shadowColor = colour;
  paint.shadowBlur = reach;
  action();
  paint.restore();
}

function drawSnake() {
  const { snake } = state;
  snake.slice().reverse().forEach((part, reversed) => {
    const index = snake.length - 1 - reversed;
    const inset = index === 0 ? 2 : 3 + 5 * (index / snake.length);
    paint.globalAlpha = index === 0 ? 1 : 1 - 0.45 * (index / snake.length);
    paint.fillStyle = index === 0 ? theme.head : theme.body;
    paint.beginPath();
    paint.roundRect(part.x * CELL + inset, part.y * CELL + inset, CELL - 2 * inset, CELL - 2 * inset, 7);
    paint.fill();
  });
  paint.globalAlpha = 1;
  const head = snake[0];
  const facing = VECTORS[state.dir];
  paint.fillStyle = theme.background;
  for (const side of [-1, 1]) {
    const eyeX = (head.x + 0.5) * CELL + facing.x * 6 + facing.y * side * 6;
    const eyeY = (head.y + 0.5) * CELL + facing.y * 6 + facing.x * side * 6;
    paint.beginPath();
    paint.arc(eyeX, eyeY, 3, 0, Math.PI * 2);
    paint.fill();
  }
}

function drawComet(item) {
  for (let back = 3; back >= 1; back--) {
    paint.globalAlpha = 0.34 - back * 0.09;
    paint.fillStyle = theme.comet;
    const x = wrap(item.x - item.dx * back, COLS);
    const y = wrap(item.y - item.dy * back, ROWS);
    paint.beginPath();
    paint.arc((x + 0.5) * CELL, (y + 0.5) * CELL, CELL * (0.42 - back * 0.08), 0, Math.PI * 2);
    paint.fill();
  }
  paint.globalAlpha = 1;
  sprite(theme.sprites.comet, item, theme.comet);
}

function draw() {
  paint.fillStyle = theme.background;
  paint.fillRect(0, 0, canvas.width, canvas.height);
  paint.fillStyle = '#ffffff';
  SKY.forEach(point => { paint.globalAlpha = point.alpha * 0.6; paint.fillRect(point.x, point.y, point.size, point.size); });
  paint.globalAlpha = 0.55;
  paint.strokeStyle = theme.grid;
  for (let x = 0; x <= COLS; x++) { paint.beginPath(); paint.moveTo(x * CELL, 0); paint.lineTo(x * CELL, canvas.height); paint.stroke(); }
  for (let y = 0; y <= ROWS; y++) { paint.beginPath(); paint.moveTo(0, y * CELL); paint.lineTo(canvas.width, y * CELL); paint.stroke(); }
  paint.globalAlpha = 1;
  glow(theme.extra, 14, () => state.extras.forEach(item => sprite(theme.sprites.extra, item, theme.extra)));
  glow(theme.star, 16, () => state.stars.forEach(item => sprite(theme.sprites.star, item, theme.star)));
  glow(theme.comet, 14, () => state.comets.forEach(drawComet));
  glow(theme.head, 12, drawSnake);
  if (state.over) {
    paint.fillStyle = 'rgba(5, 8, 24, 0.72)';
    paint.fillRect(0, 0, canvas.width, canvas.height);
    paint.textAlign = 'center';
    const endings = { comet: 'hit by a comet', self: 'bit its own tail', cleared: 'every star collected' };
    paint.fillStyle = state.reason === 'cleared' ? theme.head : theme.comet;
    paint.font = 'bold 56px ui-monospace, Consolas, monospace';
    paint.fillText(state.reason === 'cleared' ? 'CLEARED' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 12);
    paint.fillStyle = '#e6ecff';
    paint.font = '22px ui-monospace, Consolas, monospace';
    paint.fillText('score ' + state.score + ' : ' + (endings[state.reason] || state.reason), canvas.width / 2, canvas.height / 2 + 30);
  }
  document.getElementById('score').textContent = 'score ' + state.score;
  document.getElementById('pace').textContent = state.tickMs + ' ms';
  document.getElementById('status').textContent = state.over ? 'R restarts' : 'arrow keys steer, R restarts';
}

function tick() {
  if (!state.over) {
    const input = useBot ? botMove(state) : pending;
    pending = null;
    state = step(state, input);
    draw();
  }
  setTimeout(tick, state.tickMs);
}

addEventListener('keydown', event => {
  if (KEYS[event.key]) { pending = KEYS[event.key]; event.preventDefault(); }
  if (event.key === 'r' || event.key === 'R') { state = init(firstSeed); draw(); }
});
draw();
setTimeout(tick, state.tickMs);
</script>
</body>
</html>
