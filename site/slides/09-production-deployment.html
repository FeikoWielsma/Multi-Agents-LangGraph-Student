<h1 id="production-agent-services">Production Agent Services</h1>
<ul>
<li>A notebook serves one person, and its memory ends with the kernel</li>
<li>A service has more duties :
<ul>
<li>Any program can start a build over HTTP</li>
<li>The project board is still there after the server restarts</li>
<li>A score shows whether a change made the crew better</li>
<li>A budget stops a run that spends too much</li>
</ul>
</li>
<li>Agent Server is the program that serves LangGraph graphs and Deep Agents over HTTP</li>
<li>The Comet Arcade crew runs on it in this module ; demos 01 to 08 serve Veenhaven Bus graphs</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="2" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="2" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="langgraph-api">LangGraph API</h1>
<ul>
<li>An API is a set of URLs that a program can call. Agent Server offers the LangGraph API</li>
<li>Its three resources :
<ul>
<li>Assistant : a graph with its default settings, such as the <code>crew</code> graph</li>
<li>Thread : one saved project board, kept across runs</li>
<li>Run : one execution of an assistant on a thread</li>
</ul>
</li>
<li><code>langgraph dev</code>, a self-hosted server and LangSmith Deployment offer the same API</li>
<li>Clients call it through the <code>langgraph-sdk</code> package</li>
<li>Studio is a web page that calls this API and draws the graph</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="3" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="3" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="agent-server-resources">Agent Server Resources</h1>
<ul>
<li>An assistant binds a <code>graph_id</code> from <code>langgraph.json</code> to runtime defaults</li>
<li>A thread holds checkpointed state across runs</li>
<li>A run applies input to an assistant on a thread, and returns a status and results</li>
<li>Background runs support join, cancel and stream</li>
<li>Follow-ups reuse the same thread id, so earlier messages stay available</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="4" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="4" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="langgraphjson">langgraph.json</h1>
<ul>
<li>One project file tells the server which graphs to load. For the Comet Arcade crew :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">{</span></span>
<span class="line"><span style="color:#D32F2F">  "dependencies"</span><span style="color:#212121">:</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"."</span><span style="color:#24292EFF">]</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#D32F2F">  "graphs"</span><span style="color:#212121">:</span><span style="color:#24292EFF"> {</span></span>
<span class="line"><span style="color:#D32F2F">    "crew"</span><span style="color:#212121">:</span><span style="color:#22863A"> "./crew.py:crew"</span></span>
<span class="line"><span style="color:#24292EFF">  }</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#D32F2F">  "env"</span><span style="color:#212121">:</span><span style="color:#22863A"> "../../../.env"</span></span>
<span class="line"><span style="color:#24292EFF">}</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>crew</code> is the name clients use ; <code>./crew.py:crew</code> is the compiled graph in that file</li>
<li>The server adds its own checkpointer, so the graph compiles without one</li>
<li>demo01 registers three Veenhaven Bus graphs the same way</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">agent-server</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="5" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="5" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="langgraph-dev-and-studio">langgraph dev and Studio</h1>
<ul>
<li>One command serves the project on the laptop :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> langgraph</span><span style="color:#2B5581"> dev</span><span style="color:#2B5581"> --no-browser</span><span style="color:#2B5581"> --port</span><span style="color:#1976D2"> 2134</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Studio opens against that address and draws the crew as a graph</li>
<li>EU accounts add <code>--studio-url https://eu.smith.langchain.com</code></li>
<li><code>/ok</code> answers once the server is ready for its first client</li>
<li><code>--n-jobs-per-worker</code> sets how many runs can work at once</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01b</code><br><code class="pill-demo pill-desc">langgraph-dev-and-studio</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="6" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="6" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="threads-and-runs-in-practice">Threads and Runs in Practice</h1>
<ul>
<li><code>assistants.search</code> lists the served graphs</li>
<li><code>threads.create</code> opens a thread and returns its id</li>
<li><code>runs.wait</code> starts a run and returns when it finishes</li>
<li><code>threads.get_state</code> reads the saved board ; <code>runs.list</code> lists the runs on a thread</li>
<li>A second run on the same thread sees what the first one saved :
<ul>
<li>In demo01, on the Veenhaven Bus stock graph, a follow-up recalls part CE-CF-02 without a new lookup</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01c</code><br><code class="pill-demo pill-desc">threads-and-runs</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="7" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="7" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="streaming-to-clients">Streaming to Clients</h1>
<ul>
<li>A build takes about 25 seconds, and a client can show progress during that time</li>
<li>Server-sent events keep one HTTP response open and deliver each event as it happens</li>
<li>A stream mode selects the events :
<ul>
<li><code>updates</code> : what each node wrote when it finished</li>
<li><code>messages</code> or <code>messages-tuple</code> : model text, piece by piece, with the node that wrote it</li>
<li><code>values</code> : the full state after each step</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">serving-in-practice</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="8" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="8" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="stream-modes-and-subgraphs">Stream Modes and Subgraphs</h1>
<ul>
<li><code>langgraph_node</code> names the node that produced each message chunk</li>
<li>Tool results arrive as message events too</li>
<li>Clients keep AI chunks from the <code>model</code> node for text shown to a user</li>
<li><code>stream_subgraphs=True</code> adds events from nested graphs</li>
<li>A list of stream modes requests tokens and node updates together</li>
<li><code>threads.get_state</code> reads the saved state after the stream ends</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="9" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="9" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="double-texting-and-concurrency">Double-Texting and Concurrency</h1>
<ul>
<li>Double-texting : a second request arrives while a run is busy on that thread</li>
<li><code>multitask_strategy</code> chooses what happens :
<ul>
<li><code>reject</code> returns HTTP 409 and the first run continues</li>
<li><code>enqueue</code> lets the first run finish, then starts the second ; it is the default</li>
<li><code>interrupt</code> halts the first run and keeps its progress</li>
<li><code>rollback</code> halts the first run and reverts its progress</li>
</ul>
</li>
<li>Provider quotas and worker capacity both limit how many runs can work at once</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02b</code><br><code class="pill-demo pill-desc">double-texting</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="10" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="10" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="persistence-backends">Persistence Backends</h1>
<ul>
<li>Production Agent Server keeps thread checkpoints in a database</li>
<li>PostgreSQL is the default production checkpoint backend</li>
<li>Local <code>langgraph dev</code> keeps development files under <code>.langgraph_api</code></li>
<li>How long threads are kept follows product and compliance requirements</li>
<li>A Store holds memory across threads, such as the studio style guide</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="11" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="11" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="checkpoint-storage-and-ttls">Checkpoint Storage and TTLs</h1>
<ul>
<li>Shared checkpoint storage lets several worker processes serve one thread</li>
<li>A TTL, a time to live, deletes expired threads or prunes older checkpoints</li>
<li>Backups and access controls apply to thread data as to any customer store</li>
<li>Development storage is kept across a local restart and is not a production database</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02c</code><br><code class="pill-demo pill-desc">persistence-across-restarts</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="12" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="12" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="deltachannel">DeltaChannel</h1>
<ul>
<li><code>DeltaChannel</code> is beta in LangGraph 1.2.17</li>
<li>A list that grows by a reducer, such as the bug list, is expensive to save whole at every step</li>
<li>Checkpoints store each write, with a full snapshot at intervals</li>
<li>Replay applies earlier writes to rebuild the list</li>
<li>Reducers must be deterministic and give the same result however writes are batched</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="13" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="13" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="async-subagents">Async Subagents</h1>
<ul>
<li>An async subagent is a graph that works in the background while its parent keeps going</li>
<li>The Producer can start a long bot test, answer the Publisher and collect the score later</li>
<li><code>AsyncSubAgent</code> adds these tools to the parent :
<ul>
<li><code>start_async_task</code>, <code>check_async_task</code>, <code>update_async_task</code></li>
<li><code>cancel_async_task</code>, <code>list_async_tasks</code></li>
</ul>
</li>
<li>A target graph on the same server omits <code>url</code> ; a remote one passes <code>url</code> and <code>headers</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">async-subagents</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="14" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="14" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="async-task-lifecycle">Async Task Lifecycle</h1>
<ul>
<li><code>start_async_task</code> launches a background run and returns a task id</li>
<li><code>check_async_task</code> reads current status and results</li>
<li><code>update_async_task</code> interrupts the current run and starts a new run on its thread</li>
<li><code>cancel_async_task</code> stops a held or running task</li>
<li><code>list_async_tasks</code> reports tracked tasks, optionally filtered by status</li>
<li>The task id is the worker's thread id ; <code>runs.join(task_id, run_id)</code> waits on it</li>
<li>Updates keep the task id and replace the run id</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="15" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="15" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="co-deployed-graphs">Co-deployed Graphs</h1>
<ul>
<li>Supervisor and worker graphs share one <code>langgraph.json</code></li>
<li>The supervisor is a Deep Agent with an <code>AsyncSubAgent</code> entry</li>
<li>The worker is a compiled graph with a <code>messages</code> key</li>
<li>The parent addresses the worker by <code>graph_id</code></li>
<li>In demo03 the Veenhaven Bus supervisor delegates stock research to the <code>researcher</code> graph</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="16" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="16" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="firstmate-orchestration">Firstmate Orchestration</h1>
<ul>
<li><code>firstmate</code> coordinates coding agents through processes and files</li>
<li>One first mate dispatches each task to a crewmate in its own git worktree</li>
<li>The first mate watches, steers and cancels those tasks</li>
<li>State sits on disk, and a watcher wakes the first mate on events</li>
<li>Separate worktrees keep each agent's changes apart</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="17" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="17" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="a2a-on-agent-server">A2A on Agent Server</h1>
<ul>
<li>Every assistant exposes <code>/a2a/{assistant_id}</code>, where <code>assistant_id</code> is a UUID</li>
<li>The agent card is at <code>/.well-known/agent-card.json?assistant_id=...</code></li>
<li>The binding is A2A v1.0 JSON-RPC, with send, stream, get, cancel and list tasks</li>
<li><code>contextId</code> identifies the Agent Server thread ; state needs a <code>messages</code> key</li>
<li><code>assistants.search</code> resolves graph names to assistant UUIDs</li>
<li>Task history returns tool results to the caller as a <code>data</code> part</li>
<li>MCP, A2A, Agent Skills and AGENTS.md all belong to one neutral body, the Agentic AI Foundation</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">a2a-on-agent-server</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="18" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="18" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="deployment-options">Deployment Options</h1>
<ul>
<li>LangSmith Deployment lists four kinds of hosting :
<ul>
<li>Cloud : LangChain hosts the control plane, the data plane and the databases</li>
<li>Hybrid : LangChain's control plane, Agent Servers in your infrastructure</li>
<li>Self-hosted with control plane : both planes in your infrastructure</li>
<li>Standalone server : Agent Server containers without a control plane</li>
</ul>
</li>
<li>The control plane creates and updates servers ; the data plane runs them</li>
<li>All four run the same Agent Server from the same <code>langgraph.json</code></li>
<li>Operations ownership, region and compliance decide the choice</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="19" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="19" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="managed-deep-agents">Managed Deep Agents</h1>
<ul>
<li>A hosted runtime in LangSmith runs the open-source Deep Agents harness</li>
<li>Public beta at launch ; launch hosting was US only</li>
<li>Version 0.10 of 29 October 2026 adds browser use and async subagents</li>
<li>An agent is a folder :
<ul>
<li><code>agent.py</code> : model and configuration, required</li>
<li><code>instructions.md</code>, <code>skills/</code>, <code>tools/</code>, <code>middleware/</code></li>
<li>Optional <code>sandbox/</code>, <code>memory.py</code>, <code>channels/</code>, <code>schedules/</code>, <code>evals/</code></li>
</ul>
</li>
<li>CLI <code>mda</code> from the <code>managed-deepagents</code> package : <code>init</code>, <code>dev</code>, <code>evals</code>, <code>deploy</code></li>
<li>LangChain pricing, 30 October 2026 : Plus is $39 per seat per month with 1 free small serverless deployment</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="20" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="20" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="scaling-strategies">Scaling Strategies</h1>
<ul>
<li>API processes keep no state of their own and share threads through PostgreSQL</li>
<li>Long runs belong in workers, and clients poll or subscribe</li>
<li>Local concurrency uses <code>--n-jobs-per-worker</code></li>
<li>Production concurrency uses <code>N_JOBS_PER_WORKER</code></li>
<li>Provider quotas limit model requests across all workers</li>
<li>More workers add run capacity up to database and provider limits</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="21" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="21" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="evaluating-a-multi-agent-system">Evaluating a Multi-Agent System</h1>
<ul>
<li>An eval runs the agent on fixed cases and scores the result, so two versions can be compared</li>
<li>Four levels, from the outside in :
<ul>
<li>Final response : is the answer right and complete</li>
<li>Single step : did the model pick the right tool and arguments</li>
<li>Trajectory : which tools were called, in which order</li>
<li>Multi-turn : did the conversation reach its goal</li>
</ul>
</li>
<li>A score per crew member shows which one failed</li>
<li>Correct specialist results do not prove the final answer : the last step can drop a fact</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="22" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="22" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="what-the-comet-arcade-evals-found">What the Comet Arcade Evals Found</h1>
<table>
<thead>
<tr>
<th>kit</th>
<th>what changed</th>
<th>runs</th>
<th>pass</th>
</tr>
</thead>
<tbody>
<tr>
<td>v1</td>
<td>first version</td>
<td>16</td>
<td>15</td>
</tr>
<tr>
<td>v2</td>
<td>stricter <code>star-grows</code> test ; the Coder sees the raw report</td>
<td>16</td>
<td>14</td>
</tr>
<tr>
<td>v3</td>
<td><code>rules.md</code> spells out the order of a step</td>
<td>20</td>
<td>20</td>
</tr>
</tbody>
</table>
<ul>
<li>A pass means every rule test passed and the bot ate at least 10 stars on average over 5 games</li>
<li>Every run is counted, the failed ones too</li>
<li>Each failure was traced to a cause, and each cause led to a change in the kit</li>
<li>All three builds that failed stopped at the cap of 3 attempts ; none shipped</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="23" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="23" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="limits-of-the-evidence">Limits of the Evidence</h1>
<ul>
<li>Tests prove the rules, and only opening the file proves it plays :
<ul>
<li>Without the kit, 8 of 8 whole files passed the tests and 7 of 8 ran in a browser</li>
<li>The eighth called <code>init(0xC0MET)</code>, a pun that is no number, and showed a blank page</li>
</ul>
</li>
<li>A model's explanation of a bug is a guess :
<ul>
<li>One Tester blamed <code>freeCell</code> and the Coder chased it for 3 attempts until the cap stopped the run</li>
</ul>
</li>
<li>20 of 20 still allows a true pass rate of 86 %</li>
<li>The same seed does not reproduce a run : seed 13 needed the fix loop once and passed first try on a repeat</li>
<li>These numbers say nothing about a twist off the menu, which has no tests</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="24" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="24" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="final-answer-evaluation">Final Answer Evaluation</h1>
<ul>
<li>A final-answer eval checks facts in the reply against a trusted source</li>
<li>Code scorers compare the required facts with tool results</li>
<li>Text checks miss false claims and reject valid rewordings</li>
<li>demo05 takes the expected stock and depot of a Veenhaven Bus part from the database</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">evaluating-agents</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="25" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="25" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="trajectory-match">Trajectory Match</h1>
<ul>
<li>A trajectory is the list of tool calls and results in one run</li>
<li><code>agentevals</code> compares a live trajectory with a reference trajectory</li>
<li><code>strict</code> needs the same messages in the same roles, and <code>unordered</code> needs the same tool calls</li>
<li>Arguments must match exactly by default</li>
<li>A strict reference needs the tool result and the answer as well as the call :
<ul>
<li>In demo05b on the Veenhaven Bus stock graph, strict fails a short reference and passes the full one</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05b</code><br><code class="pill-demo pill-desc">trajectory-match</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="26" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="26" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="trajectory-match-modes">Trajectory Match Modes</h1>
<ul>
<li>Four match modes on 0.0.9 :
<ul>
<li><code>strict</code> : same message roles and matching calls per message</li>
<li><code>unordered</code> : same tool-call coverage across messages</li>
<li><code>subset</code> : outputs introduce no calls beyond the reference</li>
<li><code>superset</code> : outputs include at least the reference calls</li>
</ul>
</li>
<li>Strict matching ignores prose and call order within one message</li>
<li><code>tool_args_match_mode</code> is <code>exact</code> by default, or <code>ignore</code>, <code>subset</code>, <code>superset</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="27" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="27" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="trajectory-judge">Trajectory Judge</h1>
<ul>
<li>A judge is a second model that grades a run against a rubric, a written list of criteria</li>
<li><code>create_trajectory_llm_as_judge</code> gives it the task, tool calls, results and answer</li>
<li>It returns a score and a short justification in <code>comment</code></li>
<li>Check a judge against human labels before it can block a release</li>
<li>A judge has model biases, so read the justifications on a sample</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05c</code><br><code class="pill-demo pill-desc">trajectory-judge</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="28" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="28" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="specialist-and-system-evaluation">Specialist and System Evaluation</h1>
<ul>
<li>Each specialist gets its own rubric. On the Veenhaven Bus graphs in demo05d :
<ul>
<li>Parts must keep the count and depot</li>
<li>Manuals must keep the action and condition</li>
</ul>
</li>
<li>A negative control proves the judge can say no : a count changed from 6 to 9 failed 3 of 3 trials</li>
<li>A system eval checks every required fact in the combined answer</li>
<li>A failure then points at tool coverage, specialist quality or a fact lost in synthesis</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05d</code><br><code class="pill-demo pill-desc">each-agent</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="29" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="29" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="passk-and-passk">pass@k and pass^k</h1>
<ul>
<li>An agent varies from run to run, so one run is one sample</li>
<li>Run each case k times :
<ul>
<li>pass@k : at least one of the k trials passes</li>
<li>pass^k : all k trials pass</li>
</ul>
</li>
<li>pass@k suits a tool that a person can retry ; pass^k suits an agent that must work every time</li>
<li>demo05e, Veenhaven Bus, 4 cases of 3 trials : each case passed all trials or none, so pass@3 = pass^3 = 3/4</li>
<li>Anthropic's example : 75 % per trial gives pass^3 of about 42 % when trials are independent</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05e</code><br><code class="pill-demo pill-desc">pass-at-k</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="30" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="30" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="a-langsmith-experiment">A LangSmith Experiment</h1>
<ul>
<li>LangSmith keeps a dataset of cases and the score of every run against it</li>
<li>The trainer experiment writes a Veenhaven Bus dataset to EU LangSmith</li>
<li>Code evaluators score a stock fact and <code>part_stock</code> coverage</li>
<li>Account or permission failures are reported, and the local agent still runs</li>
<li>Online evaluators reuse the same rubrics on sampled production traces</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">a-langsmith-experiment</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="31" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="31" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="monitoring">Monitoring</h1>
<ul>
<li>A trace is the record of one run : every model call, tool call, result and failure</li>
<li>LangSmith Trajectories show one timeline across a parent and its subagents</li>
<li>Online evals score a sample of production runs automatically</li>
<li>Dashboards track cost per run, latency, error rate and judge scores</li>
<li>Alerts fire when a quality score falls ; a sample can miss a failure</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="32" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="32" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="cost-optimisation">Cost Optimisation</h1>
<ul>
<li>Each crew member can have its own model and its own token budget</li>
<li>A compact handoff reduces input tokens :
<ul>
<li>In demo07 a Veenhaven Bus synthesis read 138 tokens from a transcript and 50 from a summary</li>
</ul>
</li>
<li>Provider prompt caching reuses a long stable start of a prompt :
<ul>
<li>Instructions and tools go first, changing content last</li>
<li>Eligibility and retention depend on routing and the provider</li>
<li>OpenAI lists Luna cache writes at 25 % above input, so a prefix saves money from its first cached read</li>
</ul>
</li>
<li>A cached prompt still sends a request and gets a new reply</li>
<li>Usage reports separate input, cached input and output tokens</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">cost</code></p>
</blockquote>
<blockquote>
<p><code class="pill-demo pill-id">demo07b</code><br><code class="pill-demo pill-desc">prompt-caching</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="33" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="33" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="budget-stops">Budget Stops</h1>
<ul>
<li>A guard is a limit in code that the model cannot override :
<ul>
<li><code>max_tokens</code> ends one reply. On Luna a cap of 200 ended a reply at 200 tokens</li>
<li><code>ModelCallLimitMiddleware</code> ends a <code>create_agent</code> loop after a number of model calls</li>
<li>A gate ends the graph on attempts or on money spent :</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> gate</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">board</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> board</span><span style="color:#212121">[</span><span style="color:#22863A">"passed"</span><span style="color:#212121">]:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#22863A"> "publisher"</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> board</span><span style="color:#212121">[</span><span style="color:#22863A">"attempts"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> >=</span><span style="color:#1976D2"> 3</span><span style="color:#D32F2F"> or</span><span style="color:#24292EFF"> board</span><span style="color:#212121">[</span><span style="color:#22863A">"spent"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> >=</span><span style="color:#1976D2"> 0.01</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> END</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#22863A"> "coder"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A reply cut by <code>max_tokens</code> is incomplete, so treat <code>finish_reason</code> <code>length</code> as a failure</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="34" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="34" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="error-return-channel">Error Return Channel</h1>
<ul>
<li>Prompt injection : text in a tool result that the model obeys as if it were an instruction</li>
<li>Tool errors go back to the agent so it can recover, and error text can contain an injected instruction</li>
<li>Fixed error codes keep untrusted text out of the reply</li>
<li>demo08 changes one defence at a time on a Veenhaven Bus report tool :
<ul>
<li>A fixed code with the export tool kept</li>
<li>Then no export tool, and a prompt that treats codes as data</li>
</ul>
</li>
<li>Application code validates the stock lookup outside the agent</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">injection-through-an-error</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="35" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="35" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="35" data-size="16:10">
<div class="ml-eyebrow"><a>Production Deployment</a></div>
<h1 id="summary--production-deployment">Summary : Production Deployment</h1>
<ul>
<li>Agent Server serves assistants, threads and runs from <code>langgraph.json</code></li>
<li>The same graph runs on a laptop and in production, and the board is kept across a restart</li>
<li>Clients stream events and read saved thread state</li>
<li>Async subagents work in the background ; A2A exposes assistants to other systems</li>
<li>Evals score final answers, trajectories and each crew member</li>
<li>pass@k and pass^k report repeated trials ; a trace shows why one failed</li>
<li>Token counts guide handoffs and caching, and guards stop a run in code</li>
<li>Tool error text can inject an instruction, so error messages are untrusted input</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise10</code><br><code class="pill-exercise pill-desc">Evaluating a System of Agents</code><br />
<code class="pill-exercise pill-id">exercise11</code><br><code class="pill-exercise pill-desc">An Async Subagent on a Server</code></p>
</blockquote>
</section>
