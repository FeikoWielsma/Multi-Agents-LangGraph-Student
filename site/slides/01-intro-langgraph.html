<h1 id="a-crew-of-thirty-agents">A Crew of Thirty Agents</h1>
<div style="display:grid;grid-template-columns:1.5fr 1fr;gap:0 1.5em;align-items:start;">
<div>
<ul>
<li>A personal setup, October 2026, built on the open-source <code>firstmate</code> distribution :
<ul>
<li>About 30 Grok agents, each with a single job</li>
<li>One first mate takes every request and hands it to the right agent</li>
</ul>
</li>
<li>The jobs include :
<ul>
<li>Dutch bookkeeping and taxes against a bunq account</li>
<li>An inbox over Gmail and Outlook, Home Assistant, a Tesla</li>
<li>The admin of his app goldmary.eu, a portfolio advisor</li>
<li>A seller and a buyer, side by side</li>
</ul>
</li>
<li>The agents share one computer and one set of browser logins</li>
<li>&quot;nothing gets sent without my ok&quot;</li>
</ul>
</div>
<div>

<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="ten-thousand-agents-on-navier-stokes">Ten Thousand Agents on Navier-Stokes</h1>
<ul>
<li>OpenAI, 8 September 2026 : a proposed resolution of a Millennium Prize Problem :
<ul>
<li>A smooth fluid at rest, under a smooth force, develops a singularity in finite time</li>
</ul>
</li>
<li>Found by a system of coordinating agents on an unreleased internal model :
<ul>
<li>On the order of 10,000 concurrent agents in the group that found it</li>
<li>88 hours to the proof, then 17 hours to formalise it in Lean</li>
<li>2.7 million messages and about 130 billion output tokens</li>
</ul>
</li>
<li>Mathematicians are still examining it</li>
<li>OpenAI does not claim the prize</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="3" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="3" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="how-the-swarm-was-organised">How the Swarm Was Organised</h1>
<ul>
<li>Agents worked in groups and messaged only within their own group</li>
<li>Separate groups received different variants of the problem :
<ul>
<li>Some aimed at a proof of smoothness, others at a blowup</li>
</ul>
</li>
<li>Codex merged the most useful findings of each group into new prompts</li>
<li>Agents moved to Navier-Stokes after about 100 agents resolved a related Euler problem</li>
<li>The model was replaced by a further-trained version during the run</li>
<li>Lean checked the final proof :
<ul>
<li>The proof checker accepts no step that does not follow</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="4" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="4" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="a-research-team-of-agents">A Research Team of Agents</h1>
<ul>
<li>Anthropic, June 2025 : a lead agent that spawns parallel subagents for research :
<ul>
<li>Claude Opus 4 as the lead, Claude Sonnet 4 as the subagents</li>
<li>90.2 % better than a single Opus 4 agent on Anthropic's internal research evaluation</li>
</ul>
</li>
<li>The cost, from the same report :
<ul>
<li>Agents use about 4 times the tokens of a chat ; multi-agent systems about 15 times</li>
<li>Token usage alone explained 80 % of the variance in performance</li>
</ul>
</li>
<li>A poor fit, from the same report :
<ul>
<li>Domains where every agent needs the same context</li>
<li>Most coding tasks, with fewer parallel parts than research</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="5" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="5" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="recursive-language-models">Recursive Language Models</h1>
<ul>
<li>A model that treats a long input as an environment to explore in code :
<ul>
<li>The input sits in a Python REPL instead of the prompt</li>
<li>The model writes code that splits it and calls fresh copies of itself on the parts</li>
<li>Only the sub-calls use tools ; the root model sees their results</li>
</ul>
</li>
<li>Zhang, Kraska and Khattab, MIT, December 2025 :
<ul>
<li>Inputs about two orders of magnitude beyond the context window</li>
</ul>
</li>
<li>Prime Intellect called it the paradigm of 2026</li>
<li>Alex Zhang : a harness whose only tool is code</li>
<li>Deep Agents ships the idea as dynamic subagents</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="6" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="6" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="the-bill-for-a-swarm">The Bill for a Swarm</h1>
<ul>
<li>Every extra agent reads context and writes messages</li>
<li>Measured in this course on a two-part question, <code>gpt-6-luna</code> :
<ul>
<li>A single agent answered in 2 model calls ; each multi-agent pattern needed 4 to 6</li>
<li>A Deep Agent read 28 times the input tokens of the single agent</li>
</ul>
</li>
<li>Alex Zhang suspects most of a large swarm's work is wasted</li>
<li>Cognition : parallel agents make conflicting decisions (June 2025) ; parallel reviewers work, parallel writers still fail (April 2026)</li>
<li>The LangChain docs : a single agent with the right tools often does as well</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="7" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="7" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="8" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="8" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="what-is-langgraph">What is LangGraph?</h1>
<ul>
<li>LangGraph is a runtime for stateful workflows and agents :
<ul>
<li>Nodes do the work, such as a lookup, a model call or a whole agent</li>
<li>Edges fix which node may run next</li>
</ul>
</li>
<li>The runtime adds services for long-running work :
<ul>
<li>Checkpoints save state, so a stopped run resumes where it stopped</li>
<li>Interrupts pause a run until a person decides, such as approving a part order</li>
<li>Streaming shows progress and model output while the run continues</li>
</ul>
</li>
<li>LangChain agents and Deep Agents run on LangGraph</li>
<li>One graph can mix fixed steps with model decisions</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="9" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="9" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="runtime-and-harness-layers">Runtime and Harness Layers</h1>
<table>
<thead>
<tr>
<th>layer</th>
<th>provides</th>
<th>package</th>
</tr>
</thead>
<tbody>
<tr>
<td>runtime</td>
<td>state, checkpoints, interrupts, streaming</td>
<td>LangGraph 1.2.17</td>
</tr>
<tr>
<td>framework</td>
<td>model interfaces, tools, agent loop, middleware</td>
<td>LangChain 1.4.6</td>
</tr>
<tr>
<td>harness</td>
<td>filesystem, delegation, context management</td>
<td>Deep Agents 0.7.30</td>
</tr>
</tbody>
</table>
<ul>
<li>A framework supplies building blocks ; the application assembles them</li>
<li>A harness supplies a ready agent, with tools and instructions around its loop</li>
<li>The runtime leaves the most control to the application ; the harness the least</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="10" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="10" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="agent-frameworks-overview">Agent Frameworks Overview</h1>
<ul>
<li>Provider-led SDKs integrate with their ecosystems :
<ul>
<li>OpenAI Agents SDK, Google ADK and Claude Agent SDK</li>
<li>Support for other models varies by SDK and feature</li>
</ul>
</li>
<li>Model-agnostic frameworks span providers :
<ul>
<li>LangChain, CrewAI and Pydantic AI</li>
<li>LangGraph exposes the graph runtime directly</li>
</ul>
</li>
<li>Microsoft Agent Framework succeeds AutoGen and Semantic Kernel</li>
<li>Two requirements decide the choice :
<ul>
<li>Who controls the flow, the code or the model</li>
<li>Where the agent runs and who operates it</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="11" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="11" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="framework-capabilities">Framework Capabilities</h1>
<table>
<thead>
<tr>
<th>package</th>
<th>PyPI, 26 October 2026</th>
<th>main abstraction</th>
</tr>
</thead>
<tbody>
<tr>
<td>CrewAI</td>
<td>1.15.30</td>
<td>agents, crews, tasks and flows</td>
</tr>
<tr>
<td>OpenAI Agents SDK</td>
<td>0.24.0</td>
<td>agent loop, tools and handoffs</td>
</tr>
<tr>
<td>Google ADK</td>
<td>2.13.0</td>
<td>agents and workflow composition</td>
</tr>
<tr>
<td>Microsoft Agent Framework</td>
<td>1.23.0</td>
<td>agents and graph workflows</td>
</tr>
<tr>
<td>Claude Agent SDK</td>
<td>0.2.174</td>
<td>Claude Code harness as an SDK</td>
</tr>
<tr>
<td>Pydantic AI</td>
<td>2.61.0</td>
<td>typed dependencies and validated output</td>
</tr>
</tbody>
</table>
<ul>
<li>LangGraph needs no agent loop ; a graph of plain Python functions runs as it is</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="12" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="12" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="langgraph-control-flow">LangGraph Control Flow</h1>
<ul>
<li>LangGraph starts from state and transitions :
<ul>
<li>A node runs a function, a model call or a whole agent</li>
<li>The graph fixes which node may follow which</li>
</ul>
</li>
<li>Agent SDKs start from an agent loop and its tools</li>
<li>Other frameworks add explicit flows next to the loop :
<ul>
<li>CrewAI provides Flows</li>
<li>ADK and Microsoft Agent Framework provide workflow composition</li>
</ul>
</li>
<li><code>create_agent</code> supplies a standard loop for an agent that needs no custom graph</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="13" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="13" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="model-apis-and-agent-runtimes">Model APIs and Agent Runtimes</h1>
<table>
<thead>
<tr>
<th>interface</th>
<th>who runs the tool loop</th>
<th>role</th>
</tr>
</thead>
<tbody>
<tr>
<td>Chat Completions</td>
<td>application</td>
<td>course OpenRouter model endpoint</td>
</tr>
<tr>
<td>Responses API</td>
<td>application, with hosted tools available</td>
<td>OpenAI model interface</td>
</tr>
<tr>
<td>Agents SDK</td>
<td>SDK in the application</td>
<td>agent loop, handoffs and tracing</td>
</tr>
<tr>
<td>Managed Deep Agents</td>
<td>provider-hosted harness</td>
<td>hosted sessions and execution</td>
</tr>
</tbody>
</table>
<ul>
<li>OpenAI-compatible names an API shape ; each provider supports its own subset</li>
<li>A model only requests a tool call ; the runtime executes it and returns the result</li>
<li>LangGraph keeps the application's state between model calls</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="14" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="14" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="why-multi-agent">Why Multi-Agent?</h1>
<ul>
<li>A second agent gives a task its own context :
<ul>
<li>The parts agent sees stock tools ; the manuals agent sees repair procedures</li>
<li>Each worker returns only its result to the orchestrator</li>
</ul>
</li>
<li>Distributed development lets separate teams own separate agents</li>
<li>Parallelism runs independent lookups, such as stock and manuals, at the same time</li>
<li>LangChain documents three reasons to split :
<ul>
<li>Too many tools cause poor tool selection</li>
<li>Specialised knowledge takes up extensive context</li>
<li>Sequential constraints unlock tools in stages, such as triage before repair advice</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="15" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="15" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="context-engineering">Context Engineering</h1>
<ul>
<li>Context engineering determines which information each agent sees :
<ul>
<li>Subagents : each worker sees the task the supervisor wrote</li>
<li>Handoffs : the next specialist receives transferred state and history</li>
<li>Skills : one agent loads specialised prompts on demand</li>
<li>Router : each agent sees the part of the input routed to it</li>
</ul>
</li>
<li>Veenhaven Bus specialists receive the identifiers and tools needed for their task</li>
<li>Modules 05 and 06 compare calls and tokens across patterns</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="16" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="16" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="one-agent-with-more-tools">One Agent with More Tools</h1>
<ul>
<li>One agent with the right tools is the baseline every split is measured against</li>
<li>Every tool description travels with every model call</li>
<li>The Veenhaven Bus probe adds tools for unrelated company systems :
<ul>
<li>Eight repair tools and six questions stay the same</li>
<li>The added tools return no records</li>
</ul>
</li>
<li>Input tokens per call grow from 531 at 8 tools to 1,663 at 60</li>
<li>The fact check passes 6, 5, 6 and 5 of 6 at 8, 20, 40 and 60 tools</li>
<li>Question 6 was misread at every size : the fault code F-CD-101 taken for a fleet number</li>
<li>No distractor tool is called in the saved run</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">one-agent-limits</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="17" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="17" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="when-one-agent-is-enough">When One Agent is Enough</h1>
<ul>
<li>The LangChain docs warn before they teach the patterns :
<ul>
<li>&quot;a single agent with the right (sometimes dynamic) tools and prompt can often achieve similar results&quot;</li>
</ul>
</li>
<li>One agent suits a task whose context fits and whose tools it picks correctly</li>
<li>Dynamic tool loading keeps one agent's tool list short</li>
<li>A fixed process fits a workflow, with model calls only where judgment is needed</li>
<li>A second agent adds model calls ; the course probe measured 2 for one agent, 4 to 6 per pattern</li>
<li>A split needs a measured failure that one agent cannot fix</li>
<li>Independent tasks with distinct context are the case worth testing</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="18" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="18" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="how-multi-agent-systems-fail">How Multi-Agent Systems Fail</h1>
<ul>
<li>MAST, Cemri et al., UC Berkeley, 2025 : more than 1,600 traces from 7 frameworks</li>
<li>14 failure modes in three categories :
<ul>
<li>System design issues, such as step repetition or a missed termination condition</li>
<li>Inter-agent misalignment, such as information withholding or reasoning-action mismatch</li>
<li>Task verification, such as premature termination or incorrect verification</li>
</ul>
</li>
<li>Cognition, April 2026, &quot;writes stay single-threaded&quot; :
<ul>
<li>Extra agents review or advise ; one agent acts</li>
<li>&quot;Our original observations still hold today for parallel-writer swarms&quot;</li>
</ul>
</li>
<li>Modules 05 to 07 meet each category : loops, handoffs, judges</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="19" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="19" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="graph-based-architecture">Graph-Based Architecture</h1>
<ul>
<li>A state graph runs steps over one shared state, such as a bus report and its lookups</li>
<li>Each node receives the state and returns the keys it changed</li>
<li>Edges define execution order :
<ul>
<li>Fixed edges select a known next step</li>
<li>Conditional edges choose from state, such as workshop or on-site repair</li>
</ul>
</li>
<li>A cycle lets a step run again, such as a retry</li>
<li><code>compile</code> turns the definition into a graph that runs</li>
<li><code>START</code> and <code>END</code> mark the entry and the exit</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="20" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="20" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="conditional-routing">Conditional Routing</h1>
<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:0 1.5em;align-items:start;">
<div>
<ul>
<li>A routing function reads the state and returns the next node's name</li>
<li><code>Literal</code> in the return type names the possible targets</li>
<li>The graph diagram shows a dashed edge to each possible target</li>
</ul>

</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="21" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="21" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="a-first-graph">A First Graph</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">builder </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> StateGraph</span><span style="color:#212121">(Report)</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_node</span><span style="color:#212121">(</span><span style="color:#22863A">"look_up_bus"</span><span style="color:#212121">, look_up_bus)</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_node</span><span style="color:#212121">(</span><span style="color:#22863A">"read_manual"</span><span style="color:#212121">, read_manual)</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_node</span><span style="color:#212121">(</span><span style="color:#22863A">"workshop"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> state</span><span style="color:#212121">: {</span><span style="color:#22863A">"where"</span><span style="color:#212121">: </span><span style="color:#22863A">"workshop"</span><span style="color:#212121">})</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_node</span><span style="color:#212121">(</span><span style="color:#22863A">"on_site"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> state</span><span style="color:#212121">: {</span><span style="color:#22863A">"where"</span><span style="color:#212121">: </span><span style="color:#22863A">"on site"</span><span style="color:#212121">})</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_edge</span><span style="color:#212121">(START, </span><span style="color:#22863A">"look_up_bus"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_edge</span><span style="color:#212121">(</span><span style="color:#22863A">"look_up_bus"</span><span style="color:#212121">, </span><span style="color:#22863A">"read_manual"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_conditional_edges</span><span style="color:#212121">(</span><span style="color:#22863A">"read_manual"</span><span style="color:#212121">, route)</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_edge</span><span style="color:#212121">(</span><span style="color:#22863A">"workshop"</span><span style="color:#212121">, END)</span></span>
<span class="line"><span style="color:#24292EFF">builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_edge</span><span style="color:#212121">(</span><span style="color:#22863A">"on_site"</span><span style="color:#212121">, END)</span></span>
<span class="line"><span style="color:#24292EFF">graph </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">compile</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The graph uses deterministic bus lookups and state updates, with no model call</li>
<li>A node returns only the keys it changes, and LangGraph merges them into the state</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">first-look</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="22" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="22" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="a-first-multi-agent-system">A First Multi-Agent System</h1>
<ul>
<li>A supervisor exposes specialists as tools :
<ul>
<li>A manuals agent reads procedures</li>
<li>A parts agent checks stock</li>
</ul>
</li>
<li>Each specialist receives the supervisor's task in a fresh conversation</li>
<li>The supervisor writes the final answer from the specialists' tool results</li>
<li>Both specialists use the same model ; neither sees the other's conversation</li>
<li>Asked both at once, the parts agent got no component name and found no part</li>
<li>The fix orders the manuals agent first and passes the fan to the parts agent</li>
<li>The saved run : 8 calls, CE-CF-02 with 6 in stock</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02b</code><br><code class="pill-demo pill-desc">first-multi-agent</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="23" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="23" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="a-stategraph-by-hand">A StateGraph by Hand</h1>
<ul>
<li>The application defines the path for one bus diagnosis :
<ul>
<li>A model extracts the fleet number and error code</li>
<li>Python looks up the bus, manual and spare part</li>
<li>A model writes the answer from those facts</li>
</ul>
</li>
<li>State stores the extracted fields, facts and answer</li>
<li>Code decides which lookups run and in what order</li>
<li>The saved run makes 2 model calls, one to extract and one to answer</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">three-levels</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="24" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="24" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="create_agent">create_agent</h1>
<ul>
<li><code>create_agent</code> builds a tool-calling loop on LangGraph</li>
<li>The model receives the prompt and tool schemas</li>
<li>Each tool result goes back to the model for its next step</li>
<li>The model decides which lookups to run and when to answer</li>
<li>The bus question and the service desk tools are the same as in the graph by hand</li>
<li>The saved run takes 4 model calls against 2 for the graph by hand</li>
<li>The compiled graph exposes its nodes and edges</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03b</code><br><code class="pill-demo pill-desc">create-agent</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="25" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="25" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="create_deep_agent">create_deep_agent</h1>
<ul>
<li><code>create_deep_agent</code> adds a harness around the agent loop :
<ul>
<li>Filesystem tools support context offloading</li>
<li>A general-purpose subagent supports delegation</li>
<li>Summarisation manages conversation history</li>
</ul>
</li>
<li>The service desk prompt and tools stay the same</li>
<li>Built-in tools and instructions raise input tokens from 1,960 to 12,045 on the bus question</li>
<li>Todo planning is opt-in in version 0.7.30</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03c</code><br><code class="pill-demo pill-desc">deep-agent</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="26" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="26" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="three-levels-compared">Three Levels Compared</h1>
<table>
<thead>
<tr>
<th>level</th>
<th>who picks the steps</th>
<th>calls</th>
<th>input tokens</th>
<th>expected facts</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>StateGraph</code> by hand</td>
<td>the code</td>
<td>2</td>
<td>216</td>
<td>pass</td>
</tr>
<tr>
<td><code>create_agent</code></td>
<td>the model</td>
<td>4</td>
<td>1,960</td>
<td>pass</td>
</tr>
<tr>
<td><code>create_deep_agent</code></td>
<td>the model, inside a harness</td>
<td>5</td>
<td>12,045</td>
<td>pass</td>
</tr>
</tbody>
</table>
<ul>
<li>One run each on <code>gpt-6-luna</code>, 26 October 2026, on the F-MM-210 question</li>
<li>All three identify MM-BT-02 as the auxiliary battery with zero stock</li>
<li>Code fixes the graph's lookup sequence</li>
<li>Both agents chose the same three lookups ; the Deep Agent also ran its own <code>grep</code></li>
<li>Module 08 compares the harness on a longer task</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="27" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="27" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="agents-versus-workflows">Agents versus Workflows</h1>
<ul>
<li>A workflow follows paths defined in code :
<ul>
<li>Branches and loops have explicit conditions</li>
<li>Model calls can handle selected steps</li>
</ul>
</li>
<li>An agent chooses its next action from available tools :
<ul>
<li>The model decides the lookup sequence</li>
<li>The model decides when it has enough information</li>
</ul>
</li>
<li>Both receive the same four bus reports</li>
<li>A fixed bus workflow escalates a report without an error code</li>
<li>An agent can search the manuals by symptom instead</li>
<li>Production systems often combine fixed and agentic steps</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">workflow-or-agent</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="28" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="28" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="what-survived-in-2026">What Survived in 2026</h1>
<ul>
<li>The design that held up in practice is an orchestrator with isolated workers :
<ul>
<li>One agent owns the task and combines results</li>
<li>Each worker receives a bounded brief and its own context</li>
</ul>
</li>
<li><code>firstmate</code> implements this shape around coding harnesses :
<ul>
<li>Each task has its own git worktree and session</li>
<li>A watcher wakes the orchestrator on events</li>
<li>Briefs and state persist in files</li>
</ul>
</li>
<li>Each worker's result still goes through review before it is merged</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="29" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="29" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="the-firstmate-orchestrator">The firstmate Orchestrator</h1>
<ul>
<li><code>firstmate</code> supplies instructions, skills, scripts and persistent state for coding harnesses</li>
<li>The MIT-licensed project supports Claude Code, Codex and Pi</li>
</ul>
<table>
<thead>
<tr>
<th><code>firstmate</code></th>
<th>in this course</th>
</tr>
</thead>
<tbody>
<tr>
<td>a first mate dispatching to crewmates</td>
<td>subagents behind one orchestrator, module 05</td>
</tr>
<tr>
<td>one git worktree and session per task</td>
<td>context isolation and backends, module 08</td>
</tr>
<tr>
<td>a watcher that wakes the first mate on events</td>
<td>event systems and async subagents, modules 06 and 09</td>
</tr>
<tr>
<td>briefs and state files on disk</td>
<td>checkpointers and the <code>Store</code>, module 03</td>
</tr>
<tr>
<td>merges escalated to the human</td>
<td>interrupts and approval flows, module 07</td>
</tr>
</tbody>
</table>
<ul>
<li>Yair reports using <code>firstmate</code> for his coding fleet</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="30" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="30" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="the-service-desk-case">The Service Desk Case</h1>
<ul>
<li>Aurelia Imaging Systems is a fictional imaging-equipment manufacturer</li>
<li>The capstone builds a service desk over its supplied data :
<ul>
<li>Manuals and service bulletins</li>
<li>Parts, equipment and service records in SQLite</li>
<li>Tickets and an evaluation set</li>
</ul>
</li>
<li>Specialists handle manuals, parts and scheduling</li>
<li>Part orders pause for approval</li>
<li>The demos run on a second fictional company, Veenhaven Bus :
<ul>
<li>10 buses at 5 depots, 13 parts, 31 manuals and 43 tickets</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="31" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="31" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="the-capstone-in-five-stages">The Capstone in Five Stages</h1>
<table>
<thead>
<tr>
<th>stage</th>
<th>after</th>
<th>Aurelia service desk</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>module 03</td>
<td>triage, a <code>service.db</code> lookup and an answer ; typed state and a checkpointer</td>
</tr>
<tr>
<td>2</td>
<td>module 05</td>
<td>specialists for parts, manuals and scheduling behind a supervisor</td>
</tr>
<tr>
<td>3</td>
<td>module 07</td>
<td>parallel diagnosis with a judge ; the manuals agent over A2A ; part-order approval inside a subagent</td>
</tr>
<tr>
<td>4</td>
<td>module 08</td>
<td>the same desk as a Deep Agent, compared with stage 3</td>
</tr>
<tr>
<td>5</td>
<td>module 09</td>
<td>serving with <code>langgraph dev</code>, an async diagnosis subagent and per-agent evaluation</td>
</tr>
</tbody>
</table>
<ul>
<li>Evaluation compares answer quality, model calls and tokens as the desk gains capabilities</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="32" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="32" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="33" data-size="16:10">
<div class="ml-eyebrow"><a>Introduction to LangGraph</a></div>
<h1 id="the-three-days">The Three Days</h1>
<table>
<thead>
<tr>
<th>day</th>
<th>modules</th>
<th>builds</th>
</tr>
</thead>
<tbody>
<tr>
<td>Monday</td>
<td>01 to 04</td>
<td>graphs, state and single agents from LangGraph primitives</td>
</tr>
<tr>
<td>Tuesday</td>
<td>05 to 07</td>
<td>the multi-agent patterns, communication between agents, control</td>
</tr>
<tr>
<td>Wednesday</td>
<td>08 to 10</td>
<td>the same system as a Deep Agent, then served, evaluated and applied</td>
</tr>
</tbody>
</table>
<ul>
<li>Three ideas run through every module :
<ul>
<li>Multi-agent is context engineering</li>
<li>One agent first ; add an agent when a measurement says so</li>
<li>Build each pattern by hand, then use the harness</li>
</ul>
</li>

<h1 id="summary--introduction-to-langgraph">Summary : Introduction to LangGraph</h1>
<ul>
<li>LangGraph runs stateful workflows and agents</li>
<li>LangChain supplies agent abstractions ; Deep Agents supplies a harness</li>
<li>State, nodes and edges make control flow explicit</li>
<li>Workflows fix paths ; agents choose actions through tools</li>
<li>Multi-agent design decides what each agent sees</li>
<li>One agent sets the baseline for quality and cost</li>
<li>Isolated workers suit tasks with distinct context needs</li>
<li>A measurement decides whether a second agent pays for itself</li>
</ul>
