</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="1" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="1" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10"><div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="what-is-an-agent-harness">What is an agent harness?</h1>
<ul>
<li>An agent harness is the code around the model loop :
<ul>
<li>It stores files, offers tools and decides when a run stops</li>
<li>The model still chooses the next tool call</li>
</ul>
</li>
<li><code>create_agent</code> is a small harness on the LangGraph runtime</li>
<li>Deep Agents is a larger harness on <code>create_agent</code> :
<ul>
<li>Files, delegation, skills, memory and context limits ship together</li>
<li>The caller still owns the task, the tools and the permissions</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="2" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="2" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="framework-runtime-harness">Framework, runtime, harness</h1>
<ul>
<li>Three layers sit under one Deep Agent :
<ul>
<li>LangChain supplies the model, the tools and agent middleware</li>
<li>LangGraph runs the graph, the checkpointer and the store</li>
<li>Deep Agents adds files, the <code>task</code> tool and the context policy</li>
</ul>
</li>
<li>The pin is <code>deepagents</code> 0.7.30, on <code>langchain</code> 1.4.6 and <code>langgraph</code> 1.2.17</li>
<li>The same patterns from module 05 are still visible in the middleware stack</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="3" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="3" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="the-agent-loop">The agent loop</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">plain </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> create_agent</span><span style="color:#212121">(llm, tools</span><span style="color:#D32F2F">=</span><span style="color:#212121">[part_stock])</span></span>
<span class="line"><span style="color:#24292EFF">result </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> plain</span><span style="color:#212121">.</span><span style="color:#6F42C1">invoke</span><span style="color:#212121">(</span><span style="color:#6F42C1">ask</span><span style="color:#212121">(STOCK_TASK), LIMIT)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The loop is model, tool, model</li>
<li>One stock lookup on <code>openai/gpt-6-luna</code> :
<ul>
<li><code>part_stock</code> ran once</li>
<li>2 model calls, 194 input tokens, 45 output tokens</li>
</ul>
</li>
<li>The answer named 6 fans at Rietpoort</li>
<li>The callback recorded 0 malformed tool calls</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">deep-agent-from-scratch</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="4" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="4" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="a-todo-list">A todo list</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">planned </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> create_agent</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    llm, tools</span><span style="color:#D32F2F">=</span><span style="color:#212121">[part_stock], middleware</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#6F42C1">TodoListMiddleware</span><span style="color:#212121">()])</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>TodoListMiddleware</code> adds <code>write_todos</code></li>
<li>The list records intended work :
<ul>
<li>The run wrote one item, called <code>part_stock</code>, then marked it completed</li>
<li>The middleware does not enforce that order</li>
</ul>
</li>
<li>The same lookup cost more context :
<ul>
<li>4 calls and 5502 input tokens</li>
<li>The plain agent used 2 calls and 194 input tokens</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01b</code><br><code class="pill-demo pill-desc">a-todo-list</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="5" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="5" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="files-in-state">Files in state</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> ScratchState</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">AgentState</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    files</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Annotated</span><span style="color:#212121">[</span><span style="color:#24292EFF">dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> str</span><span style="color:#212121">],</span><span style="color:#24292EFF"> merge_files</span><span style="color:#212121">]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Several tools write <code>files</code>, so the reducer merges dicts</li>
<li><code>write_note</code> returns a short confirmation :
<ul>
<li>The body stays under <code>files</code></li>
<li>The message list does not have to carry it</li>
</ul>
</li>
<li>The lookup saved <code>/stock.md</code> and answered 6 fans at Rietpoort</li>
<li>3 model calls, 4160 input tokens, 0 malformed tool calls</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01c</code><br><code class="pill-demo pill-desc">files</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="6" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="6" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="a-task-tool">A task tool</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">@tool</span></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> task</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">description</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#4a9c59">    """Delegate a self-contained Veenhaven Bus parts lookup to the parts worker."""</span></span>
<span class="line"><span style="color:#24292EFF">    result </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> worker</span><span style="color:#212121">.</span><span style="color:#6F42C1">invoke</span><span style="color:#212121">(</span><span style="color:#6F42C1">ask</span><span style="color:#212121">(description), LIMIT)</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#6F42C1"> answer</span><span style="color:#212121">(result)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The worker is its own <code>create_agent</code> call, with its own messages</li>
<li>The parent receives the final sentence :
<ul>
<li>The worker's tool was <code>part_stock</code></li>
<li>The parent's tools were <code>task</code> and <code>write_note</code></li>
</ul>
</li>
<li>5 model calls, 4450 input tokens, 0 malformed tool calls</li>
<li>Intermediate tool results stayed in the worker trace</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01d</code><br><code class="pill-demo pill-desc">subagents</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="7" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="7" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="create_deep_agent">create_deep_agent</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">packaged </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> create_deep_agent</span><span style="color:#212121">(model</span><span style="color:#D32F2F">=</span><span style="color:#212121">llm, tools</span><span style="color:#D32F2F">=</span><span style="color:#212121">[part_stock],</span></span>
<span class="line"><span style="color:#212121">    system_prompt</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Use the parts tool. Save a short finding in /stock.md, then answer."</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Default tools in 0.7.30 :
<ul>
<li><code>ls</code>, <code>read_file</code>, <code>write_file</code>, <code>edit_file</code>, <code>delete</code>, <code>glob</code>, <code>grep</code></li>
<li><code>execute</code> and <code>task</code></li>
</ul>
</li>
<li><code>write_todos</code> is absent until <code>TodoListMiddleware</code> is passed</li>
<li>Without <code>system_prompt</code> and a harness profile, the authored prompt is empty :
<ul>
<li><code>BASE_AGENT_PROMPT</code> has been deprecated since 0.7.0</li>
<li>Tool schemas and middleware fragments still reach the model</li>
</ul>
</li>
<li>The one-line prompt above asks for the file :
<ul>
<li>The lookup called <code>part_stock</code>, then <code>write_file</code> for <code>/stock.md</code></li>
<li>3 model calls, 6269 input tokens, 88 output tokens</li>
<li>No <code>todos</code> key was written, and the callback recorded 0 malformed tool calls</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">create-deep-agent</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="8" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="8" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="planning-with-write_todos">Planning with write_todos</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">planner </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> create_deep_agent</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    model</span><span style="color:#D32F2F">=</span><span style="color:#212121">llm, tools</span><span style="color:#D32F2F">=</span><span style="color:#212121">[part_stock], middleware</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#6F42C1">TodoListMiddleware</span><span style="color:#212121">()])</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Planning is opt-in on this pin</li>
<li>Three Codex harness profiles are the built-in exception :
<ul>
<li><code>openai:gpt-5.1-codex</code>, <code>openai:gpt-5.2-codex</code>, <code>openai:gpt-5.3-codex</code></li>

<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="interpreter-limits">Interpreter limits</h1>
<ul>
<li>Limits apply to different parts of the run :
<ul>
<li><code>memory_limit</code> bounds the QuickJS heap</li>
<li><code>timeout</code> counts VM execution time ; host calls can take longer</li>
<li><code>max_ptc_calls</code> caps <code>tools.*</code> calls in one <code>eval</code></li>
<li><code>max_result_chars</code> truncates result and console output separately</li>
</ul>
</li>
<li>REPL state persists by <code>mode</code> :
<ul>
<li><code>thread</code> across turns, <code>turn</code> within one turn, <code>call</code> for one invocation</li>
</ul>
</li>
<li>PTC calls bypass per-tool parent approval :
<ul>
<li>Gate <code>eval</code> or put approval in the called agent</li>
</ul>
</li>
</ul>
</section>

<h1 id="symlinks-and-middleware-overrides">Symlinks and middleware overrides</h1>

<li>Since 0.7.25 a rule is matched against the path and its symlink target :
<ul>

</li>
<li>0.7.31 copies the rules over, and needs <code>langchain-core</code> 1.7</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="22" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="22" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="tools-bound-to-skills">Tools bound to skills</h1>
<ul>
<li>The 7 October 2026 skills change is in this pin :
<ul>
<li><code>metadata.include_tools</code> is a space-separated list of tool names</li>
<li>Those tools are passed to <code>SkillsMiddleware</code></li>
<li>A listed tool stays off the model request until the skill is read, or named in <code>pinned_skills</code></li>
</ul>
</li>
<li><code>pinned_skills</code> on <code>invoke</code> appends each skill body, then clears the list</li>
<li>Set <code>skills_metadata</code> to <code>None</code> and the next run reads the files again</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">metadata</span><span style="color:#D32F2F">:</span></span>
<span class="line"><span style="color:#D32F2F">  include_tools</span><span style="color:#D32F2F">:</span><span style="color:#22863A"> order_fan</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06c</code><br><code class="pill-demo pill-desc">tools-bound-to-skills</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="23" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="23" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="dict-subagents">Dict subagents</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">parts </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"name"</span><span style="color:#212121">:</span><span style="color:#22863A"> "parts"</span><span style="color:#212121">,</span><span style="color:#22863A"> "description"</span><span style="color:#212121">:</span><span style="color:#22863A"> "Looks up stock and location for one part number."</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#22863A">         "system_prompt"</span><span style="color:#212121">:</span><span style="color:#22863A"> "Use part_stock. Return the stock and location."</span><span style="color:#212121">,</span><span style="color:#22863A"> "tools"</span><span style="color:#212121">:</span><span style="color:#24292EFF"> [part_stock]</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">team </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> create_deep_agent</span><span style="color:#212121">(model</span><span style="color:#D32F2F">=</span><span style="color:#212121">llm, subagents</span><span style="color:#D32F2F">=</span><span style="color:#212121">[parts])</span><span style="color:#4a9c59">  # the demo adds a system_prompt</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>task</code> takes <code>description</code> and <code>subagent_type</code></li>
<li>The default <code>mode</code> is <code>isolated</code> : the worker's messages are the description</li>
<li>A <code>general-purpose</code> subagent is added when the caller did not pass that name :
<ul>
<li>It is offered the parent's tools</li>
<li>A harness profile can set <code>GeneralPurposeSubagentProfile(enabled=False)</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">subagents</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="24" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="24" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="compiledsubagent">CompiledSubAgent</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">compiled </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"name"</span><span style="color:#212121">:</span><span style="color:#22863A"> "manuals-graph"</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#22863A">            "description"</span><span style="color:#212121">:</span><span style="color:#22863A"> "A compiled agent for one bus error code."</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#22863A">            "runnable"</span><span style="color:#212121">:</span><span style="color:#24292EFF"> manuals_graph</span><span style="color:#212121">}</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>runnable</code> is any graph whose state includes <code>messages</code></li>
<li>The harness does not wrap it in filesystem, skills or summarisation middleware</li>
<li>The parent receives the last assistant text</li>
<li>A non-empty <code>structured_response</code> is sent instead, as JSON</li>
<li><code>interrupt_on</code> from the parent is not copied onto this runnable</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07b</code><br><code class="pill-demo pill-desc">compiled-subagent</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="25" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="25" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="fork-mode">Fork mode</h1>
<ul>
<li><code>mode=&quot;fork&quot;</code> is experimental in 0.7.30</li>
<li>The worker receives the parent messages, then the task description</li>
<li>Its <code>system_prompt</code> is appended to the prompt it inherited</li>
<li>A fork cannot declare <code>skills</code>, and a <code>task</code> call from a fork is refused</li>
<li>The same question went to a compiled worker and to this fork :
<ul>
<li>Fork 8761 input tokens, compiled 4516, parent plus worker</li>
<li>Told to leave out the error code, the parent still put F-CE-110 in the description</li>
<li>Both answers were to check the traction cooling fan</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">forked </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"name"</span><span style="color:#212121">:</span><span style="color:#22863A"> "manuals-fork"</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#22863A">          "description"</span><span style="color:#212121">:</span><span style="color:#22863A"> "Continues this conversation and looks up the error already named."</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#22863A">          "system_prompt"</span><span style="color:#212121">:</span><span style="color:#22863A"> "Use fault_guidance on the error code in the conversation. Return the first action."</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#22863A">          "tools"</span><span style="color:#212121">:</span><span style="color:#24292EFF"> [fault_guidance]</span><span style="color:#212121">,</span><span style="color:#22863A"> "mode"</span><span style="color:#212121">:</span><span style="color:#22863A"> "fork"</span><span style="color:#212121">}</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07c</code><br><code class="pill-demo pill-desc">fork-mode</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="26" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="26" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="the-general-purpose-subagent">The general-purpose subagent</h1>
<ul>
<li>The built-in name is <code>general-purpose</code></li>
<li>The pin's description offers research, file search and multi-step tasks</li>
<li>It is inserted when no subagent uses that name</li>
<li><code>enabled=False</code> on <code>GeneralPurposeSubagentProfile</code> stops the insertion</li>
<li>With no synchronous subagent left, <code>create_deep_agent</code> does not register <code>task</code></li>
<li>Async subagents use a different middleware and stay available either way</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="27" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="27" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="dynamic-subagents">Dynamic subagents</h1>
<ul>
<li>Dynamic subagents dispatch configured workers from JavaScript, in beta like the interpreter itself</li>
<li>The agent writes the fan-out and combines the returned objects, simplified here from its script :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">const</span><span style="color:#1976D2"> codes</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"F-CE-110"</span><span style="color:#212121">,</span><span style="color:#22863A"> "F-CE-305"</span><span style="color:#24292EFF">];</span></span>
<span class="line"><span style="color:#D32F2F">const</span><span style="color:#1976D2"> schema</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> {type</span><span style="color:#D32F2F">:</span><span style="color:#22863A"> "object"</span><span style="color:#212121">,</span><span style="color:#24292EFF"> properties</span><span style="color:#D32F2F">:</span><span style="color:#24292EFF"> {</span></span>
<span class="line"><span style="color:#24292EFF">  error_code</span><span style="color:#D32F2F">:</span><span style="color:#24292EFF"> {type</span><span style="color:#D32F2F">:</span><span style="color:#22863A"> "string"</span><span style="color:#24292EFF">}</span><span style="color:#212121">,</span><span style="color:#24292EFF"> action</span><span style="color:#D32F2F">:</span><span style="color:#24292EFF"> {type</span><span style="color:#D32F2F">:</span><span style="color:#22863A"> "string"</span><span style="color:#24292EFF">}</span></span>
<span class="line"><span style="color:#24292EFF">}</span><span style="color:#212121">,</span><span style="color:#24292EFF"> required</span><span style="color:#D32F2F">:</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"error_code"</span><span style="color:#212121">,</span><span style="color:#22863A"> "action"</span><span style="color:#24292EFF">]};</span></span>
<span class="line"><span style="color:#D32F2F">const</span><span style="color:#1976D2"> found</span><span style="color:#D32F2F"> =</span><span style="color:#D32F2F"> await</span><span style="color:#1976D2"> Promise</span><span style="color:#6F42C1">.all</span><span style="color:#24292EFF">(</span><span style="color:#1976D2">codes</span><span style="color:#6F42C1">.map</span><span style="color:#24292EFF">(code </span><span style="color:#D32F2F">=></span><span style="color:#6F42C1"> task</span><span style="color:#24292EFF">({</span></span>
<span class="line"><span style="color:#24292EFF">  description</span><span style="color:#D32F2F">:</span><span style="color:#22863A"> "First action for "</span><span style="color:#D32F2F"> +</span><span style="color:#24292EFF"> code</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">  subagentType</span><span style="color:#D32F2F">:</span><span style="color:#22863A"> "manuals"</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">  responseSchema</span><span style="color:#D32F2F">:</span><span style="color:#24292EFF"> schema</span></span>
<span class="line"><span style="color:#24292EFF">})));</span></span>
<span class="line"><span style="color:#1976D2">JSON</span><span style="color:#6F42C1">.stringify</span><span style="color:#24292EFF">(found)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>responseSchema</code> returns structured values for declarative subagents</li>
<li><code>max_subagent_concurrency=2</code> caps simultaneous dispatches per REPL</li>
<li>The Python comparison puts the dispatch loop in the application</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">dynamic-subagents</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="28" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="28" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="recursive-language-models">Recursive language models</h1>
<ul>
<li>Zhang, Kraska and Khattab, MIT CSAIL, arXiv 2512.24601 :
<ul>
<li>A long input stays in an environment the model inspects from code</li>
<li>The model is called on the pieces, and the pieces can be split again</li>
</ul>
</li>
<li>The paper reports inputs on the order of 100 times the context window, on its tasks</li>
<li>Zhang later describes two harness families :
<ul>
<li>One keeps the trajectory in the prompt</li>
<li>One orchestrates with code and sub-calls</li>
</ul>
</li>
<li>These 31 manuals fit in one call :
<ul>
<li>One prompt used 5121 input tokens and 24 output tokens</li>
<li>Three calls used 5192 input tokens, and the largest used 2010</li>
</ul>
</li>
<li>QuickJS loads the chunks through PTC and calls the same model as a reader :
<ul>
<li>The root writes the dispatch script and receives compact findings</li>
<li>The complete chunks stay out of the root's model requests</li>
<li>Five calls used 15635 input tokens ; the largest reader used 2058</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08b</code><br><code class="pill-demo pill-desc">splitting-a-long-input</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="29" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="29" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="orchestration-shapes">Orchestration shapes</h1>
<ul>
<li>Many units of work, and a count known at run time, fit a loop in code :
<ul>
<li>Classify and act : one label selects one specialist</li>
<li>Fan-out and synthesise : one call per unit, then one combined answer</li>
<li>Adversarial verification : a second pass challenges the first</li>
<li>Generate and filter : keep the candidates that pass a check</li>
<li>Tournament : compare candidates and keep a winner</li>
<li>Loop until done : repeat until a condition, with an explicit cap</li>
</ul>
</li>
<li>A handful of fixed roles stays a dict of subagents</li>
<li>The cap is the stopping rule for loop until done</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="30" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="30" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="telling-an-orchestrator-when-to-delegate">Telling an orchestrator when to delegate</h1>
<ul>
<li>Anthropic's guidance for Claude Opus 5 offers two controls :
<ul>
<li>A delegation policy in the prompt</li>
<li>A deterministic cap on how many agents launch</li>
</ul>
</li>
<li>The policy is vendor text for Claude, quoted in the demo :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Delegate to a subagent only for large tasks that are genuinely</span></span>
<span class="line"><span>independent and parallelizable [...] If one subagent can complete</span></span>
<span class="line"><span>the task, use one rather than several, and keep spawn counts low.</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The cap here is middleware on the <code>task</code> tool ; demo08c allows 1 call, demo08d allows 2 :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">ToolCallLimitMiddleware</span><span style="color:#212121">(tool_name</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"task"</span><span style="color:#212121">, run_limit</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">2</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A blocked call returns an error message, and the run continues</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08c</code><br><code class="pill-demo pill-desc">delegation-policy</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="31" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="31" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="32" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="32" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="interrupt_on">interrupt_on</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">gated </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> create_deep_agent</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    model</span><span style="color:#D32F2F">=</span><span style="color:#212121">llm, interrupt_on</span><span style="color:#D32F2F">=</span><span style="color:#212121">{</span><span style="color:#22863A">"write_file"</span><span style="color:#212121">: </span><span style="color:#1976D2">True</span><span style="color:#212121">}, checkpointer</span><span style="color:#D32F2F">=</span><span style="color:#6F42C1">InMemorySaver</span><span style="color:#212121">())</span></span>
<span class="line"><span style="color:#24292EFF">gated</span><span style="color:#212121">.</span><span style="color:#6F42C1">invoke</span><span style="color:#212121">(</span><span style="color:#6F42C1">Command</span><span style="color:#212121">(resume</span><span style="color:#D32F2F">=</span><span style="color:#212121">{</span><span style="color:#22863A">"decisions"</span><span style="color:#212121">: [{</span><span style="color:#22863A">"type"</span><span style="color:#212121">: </span><span style="color:#22863A">"approve"</span><span style="color:#212121">}]}), config, version</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"v2"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The pause is <code>HumanInTheLoopMiddleware</code> inside the harness</li>
<li>A decision is <code>approve</code>, <code>edit</code>, <code>reject</code> or <code>respond</code></li>
<li>The graph needs a checkpointer, and resume continues the same thread</li>
<li>A declarative subagent inherits the map unless it sets <code>interrupt_on</code> itself</li>
<li>A <code>CompiledSubAgent</code> does not inherit it</li>
<li><code>FilesystemPermission</code> with <code>mode=&quot;interrupt&quot;</code> builds the same pause for matching paths</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">control</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="33" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="33" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="summarisation">Summarisation</h1>
<ul>
<li>The default stack includes summarisation middleware</li>
<li>Evicted messages are appended to <code>/conversation_history/{session}.md</code></li>
<li><code>state[&quot;messages&quot;]</code> keeps the original log ; the model sees the summary</li>
<li>This model publishes no profile, so the default trigger is 170000 tokens and the keep window is 6 messages</li>
<li>The demo replaces that middleware with a trigger of 3 messages so one lookup crosses it</li>
<li><code>compact_conversation</code> comes from <code>SummarizationToolMiddleware</code>, which the default stack does not add</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09b</code><br><code class="pill-demo pill-desc">summarisation</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="34" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="34" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="context-limits">Context limits</h1>
<ul>
<li>Three mechanisms run before a full summary :
<ul>
<li>A tool result over 20000 tokens is evicted to the filesystem</li>
<li>A human message over 50000 tokens is evicted the same way</li>
<li>Old <code>write_file</code> and <code>edit_file</code> arguments can be clipped at a lower threshold</li>
</ul>
</li>
<li>The summary call uses the agent model</li>
<li>Fraction triggers apply when <code>max_input_tokens</code> is on the model profile</li>
<li><code>openai/gpt-6-luna</code>, constructed as <code>ChatOpenAI</code> for this course, has <code>profile is None</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="35" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="35" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="state-across-context-windows">State across context windows</h1>
<ul>
<li>A long task outlives one context window, so its state needs a home :
<ul>
<li>Structured status, such as a test list, goes in a JSON file</li>
<li>Free-text progress notes go in a second file</li>
<li>Messages and graph state go in the checkpointer</li>
</ul>
</li>
<li>Deep Agents has a place for each :
<ul>
<li>The file tools write to a backend ; a store or disk backend outlives the thread</li>
<li><code>memory=[&quot;/AGENTS.md&quot;]</code> reloads standing rules at the start of every run</li>
<li>Summarisation keeps a summary and files the evicted messages</li>
</ul>
</li>
<li>Anthropic's guidance for Claude says a fresh window that re-reads the files can beat compaction</li>
<li>A fresh start here is a new <code>thread_id</code>, with a prompt that names the files to read first</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="36" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="36" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="profiles">Profiles</h1>
<ul>
<li>Profiles are a beta API in two registries :
<ul>
<li>A provider profile changes how <code>resolve_model</code> builds the chat model</li>
<li>A harness profile changes prompts, tool visibility and extra middleware after that</li>
</ul>
</li>
<li>Built-in harness keys include the three Codex specs and Claude Haiku 4.5, Sonnet 4.6 and Opus 4.7</li>
<li>Lookup for our instance uses provider <code>openai</code> and identifier <code>openai/gpt-6-luna</code></li>
<li>No key matches, so the profile is empty :
<ul>
<li>There is no base prompt and no system-prompt suffix</li>
<li>There are no excluded tools and no extra middleware</li>
</ul>
</li>
<li>Registering a profile is how a deployment would opt this model into planning or a shorter <code>task</code> list</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="37" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="37" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="deep-agents-and-the-patterns">Deep Agents and the patterns</h1>
<table>
<thead>
<tr>
<th>Harness feature</th>
<th>Module 05 pattern</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>write_todos</code></td>
<td>One agent ; the plan is state</td>
</tr>
<tr>
<td>Skills, <code>include_tools</code></td>
<td>Skills, with tools scoped to the file</td>
</tr>
<tr>
<td><code>task</code>, isolated</td>
<td>Subagents</td>
</tr>
<tr>
<td><code>mode=&quot;fork&quot;</code></td>
<td>The worker sees the parent history</td>
</tr>
<tr>
<td><code>CompiledSubAgent</code></td>
<td>A custom workflow behind one tool</td>
</tr>
<tr>
<td>Fan-out in Python</td>
<td>A custom workflow ; the loop is code</td>
</tr>
<tr>
<td><code>interrupt_on</code></td>
<td>An approval gate on a tool</td>
</tr>
</tbody>
</table>
<ul>
<li>One desk question, both builders :
<ul>
<li>Graph : 33 lines, 7 calls, 913 input tokens</li>
<li>Deep Agent : 8 lines, 6 calls, 11198 input tokens</li>
<li>Both named 6 fans at Rietpoort and the cooling-fan check</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">deep-agent-or-graph</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="38" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="38" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="the-claude-agent-sdk">The Claude Agent SDK</h1>
<ul>
<li>The Agent SDK runs Claude Code's agent loop in the application's process</li>
<li>The library includes file tools, a shell, subagents, skills, memory, permissions, sessions, hooks and MCP</li>
<li>Python and TypeScript are the supported libraries</li>
<li>The Client SDK calls the Claude API, and the application writes the tool loop</li>
<li>Managed Agents run a hosted harness, with a cloud sandbox or a self-hosted sandbox</li>
<li>Deep Agents is the harness in this course's process, on LangGraph, with the course model</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="39" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="39" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="codex">Codex</h1>
<ul>
<li>The Codex SDK starts and resumes a local Codex thread</li>
<li>TypeScript package <code>@openai/codex-sdk</code> requires Node.js 18 or later</li>
<li>Python package <code>openai-codex</code> talks to the local app server over JSON-RPC</li>
<li><code>thread.run</code> continues the thread ; a thread id resumes an older one</li>
<li>Sandbox presets on the Python SDK :
<ul>
<li><code>read_only</code> reads files</li>
<li><code>workspace_write</code> writes inside the workspace and configured roots</li>
<li><code>full_access</code> runs without those filesystem restrictions</li>
</ul>
</li>
<li>Deep Agents keeps the loop in-process and takes the model the caller built</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="40" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="40" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="the-academy-course">The Academy course</h1>
<ul>
<li>Introduction to Deep Agents, from LangChain Academy, is a free follow-up</li>
<li>Six modules cover building, the execution environment, context, delegation, a capstone with async subagents and local deployment, and Managed Deep Agents</li>
<li>The public repo at <code>github.com/langchain-ai/lca-deepagents</code> has no licence</li>
<li>This course keeps its own wording, its own examples and the Veenhaven data</li>
<li>Their code pin is <code>deepagents</code> 0.7.0 ; this room is on 0.7.30</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="41" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="41" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="41" data-size="16:10">
<div class="ml-eyebrow"><a>Deep Agents</a></div>
<h1 id="summary--deep-agents">Summary : Deep Agents</h1>
<ul>
<li>A harness packages files, skills, memory, subagents and context limits on <code>create_agent</code></li>
<li>Version 0.7 leaves the base prompt and <code>write_todos</code> to the caller, unless a profile adds them</li>
<li>File tools, permission rules and <code>LocalShellBackend</code> are the execution environment in this pin</li>
<li>Skills load on demand ; <code>include_tools</code> hides a tool until the skill is in context</li>
<li>Isolated subagents see the task ; fork mode also sees the parent messages</li>
<li>A long input can be split in code ; <code>interrupt_on</code> and summarisation bound a long run</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise08</code><br><code class="pill-exercise pill-desc">A Deep Agent</code><br />
<code class="pill-exercise pill-id">exercise09</code><br><code class="pill-exercise pill-desc">Offload and Measure</code></p>
</blockquote>
</section>
