</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="1" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="1" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10"><div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="typeddict-state">TypedDict State</h1>
<ul>
<li>A state schema names the keys shared between nodes</li>
<li><code>TypedDict</code> describes dictionary fields for type checking</li>
<li>Nodes return partial updates ; omitted keys retain their values</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> TicketState</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">TypedDict</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    ticket_id</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span></span>
<span class="line"><span style="color:#24292EFF">    symptom</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span></span>
<span class="line"><span style="color:#24292EFF">    status</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> mark_open</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">state</span><span style="color:#212121">:</span><span style="color:#24292EFF"> TicketState):</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#212121"> {</span><span style="color:#22863A">"status"</span><span style="color:#212121">:</span><span style="color:#22863A"> "open"</span><span style="color:#212121">}</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>TypedDict</code> annotations are not checked at runtime ; a wrong type passes</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">typed-dict</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="2" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="2" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="dataclass-state">Dataclass State</h1>
<ul>
<li>A dataclass supplies defaults for fields omitted from input</li>
<li>Nodes receive a dataclass instance and return dictionary updates</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">@dataclass</span></span>
<span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> TicketDefaults</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    ticket_id</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span></span>
<span class="line"><span style="color:#24292EFF">    status</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#D32F2F"> =</span><span style="color:#22863A"> "new"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> inspect_default</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">state</span><span style="color:#212121">:</span><span style="color:#24292EFF"> TicketDefaults):</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#212121"> {</span><span style="color:#22863A">"status"</span><span style="color:#212121">:</span><span style="color:#22863A"> "open"</span><span style="color:#212121">}</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Attribute access uses <code>state.status</code></li>
<li>Dataclass annotations do not enforce field types</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="3" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="3" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="pydantic-state">Pydantic State</h1>
<ul>
<li>Pydantic validates state when it is constructed for a node</li>
<li>Field constraints reject invalid input before the node runs</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> ValidatedTicket</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">BaseModel</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    ticket_id</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span></span>
<span class="line"><span style="color:#24292EFF">    hours</span><span style="color:#212121">:</span><span style="color:#1976D2"> float</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> Field</span><span style="color:#212121">(ge</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">0</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> round_hours</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">state</span><span style="color:#212121">:</span><span style="color:#24292EFF"> ValidatedTicket):</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#212121"> {</span><span style="color:#22863A">"hours"</span><span style="color:#212121">:</span><span style="color:#6F42C1"> round</span><span style="color:#212121">(state.hours, </span><span style="color:#1976D2">1</span><span style="color:#212121">)}</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An invalid write fails when the next node reads it ; the final write and the <code>invoke</code> dict are not validated</li>
<li>Validation adds runtime work compared with <code>TypedDict</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01b</code><br><code class="pill-demo pill-desc">pydantic</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="4" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="4" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="input-and-output-schemas">Input and Output Schemas</h1>
<ul>
<li>The internal schema contains the graph's working state</li>
<li><code>input_schema</code> selects the fields accepted at entry</li>
<li><code>output_schema</code> selects the fields returned by <code>invoke</code></li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">public </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> StateGraph</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    InternalState,</span></span>
<span class="line"><span style="color:#212121">    input_schema</span><span style="color:#D32F2F">=</span><span style="color:#212121">TicketInput,</span></span>
<span class="line"><span style="color:#212121">    output_schema</span><span style="color:#D32F2F">=</span><span style="color:#212121">StatusOutput,</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A ticket id enters ; only the resulting status leaves</li>
<li>The filtered keys remain in the checkpoints</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01c</code><br><code class="pill-demo pill-desc">input-and-output</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="5" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="5" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="private-state">Private State</h1>
<ul>
<li>Nodes can declare additional channels through their input schemas</li>
<li>A private schema carries internal communication between nodes</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> PrivateState</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">TypedDict</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    working_note</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> finish</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">state</span><span style="color:#212121">:</span><span style="color:#24292EFF"> PrivateState):</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#212121"> {</span><span style="color:#22863A">"status"</span><span style="color:#212121">:</span><span style="color:#24292EFF"> state</span><span style="color:#212121">[</span><span style="color:#22863A">"working_note"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> +</span><span style="color:#22863A"> " at depot"</span><span style="color:#212121">}</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Private channels can be excluded from the graph's public output</li>
<li><code>working_note</code> still appears in checkpoints and in the <code>values</code> stream</li>
<li>Hiding a key from the output gives no access control</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01d</code><br><code class="pill-demo pill-desc">private-state</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="6" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="6" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="reducers">Reducers</h1>
<ul>
<li>A reducer is the merge policy for one key of the state</li>
<li>Without a reducer, a sequential update overwrites the old value</li>
<li><code>Annotated</code> attaches a reducer to a field</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Collect</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">TypedDict</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    collected</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Annotated</span><span style="color:#212121">[</span><span style="color:#24292EFF">list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">],</span><span style="color:#24292EFF"> operator</span><span style="color:#212121">.</span><span style="color:#24292EFF">add</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#24292EFF">    last</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>operator.add</code> concatenates the incoming list with the saved list</li>
<li>Nodes return new entries for reduced keys</li>
<li>Returning the accumulated list again can duplicate entries</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="7" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="7" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="merging-state-updates">Merging State Updates</h1>

<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="messagesstate">MessagesState</h1>
<ul>
<li><code>MessagesState</code> supplies a <code>messages</code> field with <code>add_messages</code></li>
<li>Additional fields extend the schema through inheritance</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> langgraph</span><span style="color:#212121">.</span><span style="color:#24292EFF">graph </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> MessagesState</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> ServiceState</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">MessagesState</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    depot</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A node can return only its new assistant message</li>
<li>The reducer preserves earlier messages</li>
<li>The depot field keeps the default overwrite policy</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="9" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="9" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="add_messages">add_messages</h1>
<ul>
<li><code>add_messages</code> manages message identities :
<ul>
<li>New ids append messages</li>
<li>Existing ids replace the corresponding entries</li>
<li><code>RemoveMessage(id=...)</code> removes a matching entry</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">history </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> add_messages</span><span style="color:#212121">(history, [</span></span>
<span class="line"><span style="color:#6F42C1">    AIMessage</span><span style="color:#212121">(</span><span style="color:#22863A">"Assigned to workshop"</span><span style="color:#212121">, id</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"reply"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">history </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> add_messages</span><span style="color:#212121">(history, [</span><span style="color:#6F42C1">RemoveMessage</span><span style="color:#212121">(id</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"request"</span><span style="color:#212121">)])</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Message dictionaries and role-content tuples become message objects</li>
<li>Stable ids allow an application to edit an earlier message</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">add-messages</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="10" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="10" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="custom-reducers">Custom Reducers</h1>
<ul>
<li>A custom reducer receives the current value and an incoming update</li>
<li>The return value becomes the next value of that state key</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> merge_findings</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">current</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">],</span><span style="color:#FF9800"> incoming</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#6F42C1"> sorted</span><span style="color:#212121">(</span><span style="color:#1976D2">set</span><span style="color:#212121">(current) </span><span style="color:#D32F2F">|</span><span style="color:#1976D2"> set</span><span style="color:#212121">(incoming))</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Findings</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">TypedDict</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    findings</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Annotated</span><span style="color:#212121">[</span><span style="color:#24292EFF">list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">],</span><span style="color:#24292EFF"> merge_findings</span><span style="color:#212121">]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Set union removes duplicate findings in this example</li>
<li>Sorting gives a stable presentation order</li>
<li>Reducers should avoid mutating their arguments</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02b</code><br><code class="pill-demo pill-desc">custom-reducers</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="11" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="11" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="overwriting-a-reduced-key">Overwriting a Reduced Key</h1>
<ul>
<li>An ordinary update still goes through the reducer</li>
<li>An empty incoming list does not clear a concatenated list</li>
<li><code>Overwrite</code> bypasses the reducer for a replacement</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> langgraph</span><span style="color:#212121">.</span><span style="color:#24292EFF">types </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Overwrite</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">reset</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_node</span><span style="color:#212121">(</span><span style="color:#22863A">"clear"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> state</span><span style="color:#212121">: {</span></span>
<span class="line"><span style="color:#22863A">    "findings"</span><span style="color:#212121">: </span><span style="color:#6F42C1">Overwrite</span><span style="color:#212121">(value</span><span style="color:#D32F2F">=</span><span style="color:#212121">[])</span></span>
<span class="line"><span style="color:#212121">})</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The replacement can be a new value or the field's empty value</li>
<li>Two <code>Overwrite</code> values for one key in one step raise <code>InvalidUpdateError</code></li>
<li>An <code>Overwrite</code> silently discards other branches' ordinary writes to that key in the same step</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02c</code><br><code class="pill-demo pill-desc">overwriting</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="12" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="12" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="concurrent-updates">Concurrent Updates</h1>
<ul>
<li>Parallel nodes read the state available at the start of a superstep</li>
<li>Their updates merge after that step's nodes complete</li>
<li>Two writes to one unreduced key raise <code>InvalidUpdateError</code></li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">parallel</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_edge</span><span style="color:#212121">(START, </span><span style="color:#22863A">"parts"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">parallel</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_edge</span><span style="color:#212121">(START, </span><span style="color:#22863A">"workshop"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A reducer lets both branches add their workshop findings to one key</li>
<li>Separate keys suit branches that produce different results</li>
<li>A reducer keeps both findings ; picking the correct one is a separate step</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02d</code><br><code class="pill-demo pill-desc">concurrent-updates</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="13" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="13" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="checkpointers-and-persistence">Checkpointers and Persistence</h1>
<ul>
<li>A checkpointer saves execution state at superstep boundaries :
<ul>
<li>State values and the nodes scheduled next</li>
<li>Metadata and the config that identifies the checkpoint</li>
</ul>
</li>
<li>Checkpoints support memory between invocations and saved pauses</li>
<li>Persistent storage allows restoration after a process restart</li>
<li>With <code>durability=&quot;exit&quot;</code> only the final checkpoint is kept ; module 07</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> langgraph</span><span style="color:#212121">.</span><span style="color:#24292EFF">checkpoint</span><span style="color:#212121">.</span><span style="color:#24292EFF">memory </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> InMemorySaver</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">graph </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">compile</span><span style="color:#212121">(checkpointer</span><span style="color:#D32F2F">=</span><span style="color:#6F42C1">InMemorySaver</span><span style="color:#212121">())</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>InMemorySaver</code> loses its checkpoints when the process ends</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="14" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="14" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="threads">Threads</h1>
<ul>
<li><code>thread_id</code> identifies one sequence of saved graph states</li>
<li>Reusing the id loads that thread's state before applying new input</li>
<li>A different id starts a separate history</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">morning </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"configurable"</span><span style="color:#212121">:</span><span style="color:#212121"> {</span><span style="color:#22863A">"thread_id"</span><span style="color:#212121">:</span><span style="color:#22863A"> "u1-morning"</span><span style="color:#212121">}}</span></span>
<span class="line"><span style="color:#24292EFF">graph</span><span style="color:#212121">.</span><span style="color:#6F42C1">invoke</span><span style="color:#212121">({</span><span style="color:#22863A">"messages"</span><span style="color:#212121">: [(</span><span style="color:#22863A">"user"</span><span style="color:#212121">, </span><span style="color:#22863A">"My bus is 4012 and my depot is Noord."</span><span style="color:#212121">)]}, morning)</span></span>
<span class="line"><span style="color:#24292EFF">graph</span><span style="color:#212121">.</span><span style="color:#6F42C1">invoke</span><span style="color:#212121">({</span><span style="color:#22863A">"messages"</span><span style="color:#212121">: [(</span><span style="color:#22863A">"user"</span><span style="color:#212121">, </span><span style="color:#22863A">"Which bus and depot did I mention?"</span><span style="color:#212121">)]}, morning)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Messages accumulate through their reducer across invocations</li>
<li>The same thread recalls bus 4012 and depot Noord ; a new thread does not</li>
<li>A thread id is not authentication ; the application decides who may read it</li>
<li>One user can own many threads, such as <code>u1-morning</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">threads</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="15" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="15" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="sqlitesaver">SqliteSaver</h1>
<ul>
<li><code>langgraph-checkpoint-sqlite</code> supplies <code>SqliteSaver</code></li>
<li>A file-backed saver keeps checkpoints after the connection closes</li>
<li>The context manager owns the connection lifetime</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> langgraph</span><span style="color:#212121">.</span><span style="color:#24292EFF">checkpoint</span><span style="color:#212121">.</span><span style="color:#24292EFF">sqlite </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> SqliteSaver</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> SqliteSaver</span><span style="color:#212121">.</span><span style="color:#6F42C1">from_conn_string</span><span style="color:#212121">(</span><span style="color:#1976D2">str</span><span style="color:#212121">(database))</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> saver</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    persistent </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">compile</span><span style="color:#212121">(checkpointer</span><span style="color:#D32F2F">=</span><span style="color:#212121">saver)</span></span>
<span class="line"><span style="color:#24292EFF">    persistent</span><span style="color:#212121">.</span><span style="color:#6F42C1">invoke</span><span style="color:#212121">(inputs, config)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Graph calls that use the saver belong inside the <code>with</code> block</li>
<li>SQLite suits local development and small applications</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03b</code><br><code class="pill-demo pill-desc">sqlite-saver</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="16" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="16" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="postgresql-checkpoint-storage">PostgreSQL Checkpoint Storage</h1>
<ul>
<li><code>langgraph-checkpoint-postgres</code> provides a PostgreSQL backend</li>
<li>Several application processes can share one PostgreSQL checkpoint store</li>
<li>Production operation includes :
<ul>
<li>Connection management and schema setup</li>
<li>Backups and checkpoint retention</li>
<li>Access controls for thread data</li>
</ul>
</li>
<li>The checkpointer persists execution state within a thread</li>
<li>Cross-thread application memory uses a Store</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="17" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="17" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="inspecting-thread-state">Inspecting Thread State</h1>
<ul>
<li><code>get_state</code> returns a <code>StateSnapshot</code> for the selected checkpoint</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">snapshot </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> graph</span><span style="color:#212121">.</span><span style="color:#6F42C1">get_state</span><span style="color:#212121">(morning)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(snapshot.values)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(snapshot.next)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(snapshot.config[</span><span style="color:#22863A">"configurable"</span><span style="color:#212121">][</span><span style="color:#22863A">"checkpoint_id"</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>values</code> contains the saved channel values</li>
<li><code>next</code> names nodes scheduled to run from that checkpoint</li>
<li>An empty <code>next</code> indicates no scheduled continuation</li>
<li>A config with <code>checkpoint_id</code> selects a historical snapshot</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="18" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="18" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="state-history">State History</h1>
<ul>
<li><code>get_state_history</code> yields saved checkpoints, newest first</li>
<li>Each snapshot keeps its own config and parent relationship</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">history </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> list</span><span style="color:#212121">(graph.</span><span style="color:#6F42C1">get_state_history</span><span style="color:#212121">(config))</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> snapshot </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> history</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(snapshot.metadata[</span><span style="color:#22863A">"step"</span><span style="color:#212121">], snapshot.next)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">before_record </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> next</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    snapshot </span><span style="color:#D32F2F">for</span><span style="color:#212121"> snapshot </span><span style="color:#D32F2F">in</span><span style="color:#212121"> history</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#212121"> snapshot.next </span><span style="color:#D32F2F">==</span><span style="color:#212121"> (</span><span style="color:#22863A">"record"</span><span style="color:#212121">,)</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A snapshot's config selects the point for replay or forking</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">state-history</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="19" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="19" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="restoring-saved-state">Restoring Saved State</h1>
<ul>
<li>A new graph instance can load checkpoints from the same backend</li>
<li>Restoration requires the same thread id and compatible graph code</li>
<li><code>invoke(None, config)</code> continues from the saved scheduled nodes</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> SqliteSaver</span><span style="color:#212121">.</span><span style="color:#6F42C1">from_conn_string</span><span style="color:#212121">(</span><span style="color:#1976D2">str</span><span style="color:#212121">(database))</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> saver</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    restored </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> builder</span><span style="color:#212121">.</span><span style="color:#6F42C1">compile</span><span style="color:#212121">(checkpointer</span><span style="color:#D32F2F">=</span><span style="color:#212121">saver)</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(restored.</span><span style="color:#6F42C1">get_state</span><span style="color:#212121">(config).next)</span></span>
<span class="line"><span style="color:#24292EFF">    restored</span><span style="color:#212121">.</span><span style="color:#6F42C1">invoke</span><span style="color:#212121">(</span><span style="color:#1976D2">None</span><span style="color:#212121">, config)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Supplying new input applies a new input update</li>
<li>The demo closes the connection, compiles a new graph and runs <code>record</code> from the saved pause</li>
<li>Static breakpoints such as <code>interrupt_after</code> suit debugging ; module 07 pauses with <code>interrupt()</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="20" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="20" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="time-travel">Time Travel</h1>
<ul>
<li>Replay continues execution from a historical checkpoint</li>
<li>Nodes before the checkpoint retain their saved results</li>
<li>Nodes scheduled after it execute again</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">replayed </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> graph</span><span style="color:#212121">.</span><span style="color:#6F42C1">invoke</span><span style="color:#212121">(</span><span style="color:#1976D2">None</span><span style="color:#212121">, before_draft.config)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Replaying from before <code>draft</code> calls the model again ; the wording can change</li>
<li>A replayed part order can be placed a second time</li>
<li>A checkpoint with no scheduled nodes has no continuation to replay</li>
<li>Reading state with <code>get_state</code> does not replay execution</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04b</code><br><code class="pill-demo pill-desc">replay</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="21" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="21" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="forking-a-checkpoint">Forking a Checkpoint</h1>
<ul>
<li><code>update_state</code> writes a new checkpoint from a saved one</li>
<li>Updates pass through the same reducers as node updates</li>
<li><code>as_node</code> attributes the update and determines the continuation</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="22" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="22" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="deltachannel">DeltaChannel</h1>
<ul>
<li><code>DeltaChannel</code> is beta in LangGraph 1.2.17</li>
<li>Saved writes reconstruct a growing value between periodic snapshots</li>
<li>A delta reducer receives the accumulated value and a batch of writes</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> merge_batches</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">current</span><span style="color:#212121">,</span><span style="color:#FF9800"> writes</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> current </span><span style="color:#D32F2F">+</span><span style="color:#24292EFF"> [item </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> batch </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> writes </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> item </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> batch]</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> LongThread</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">TypedDict</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    entries</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Annotated</span><span style="color:#212121">[</span><span style="color:#24292EFF">list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">],</span><span style="color:#6F42C1"> DeltaChannel</span><span style="color:#212121">(merge_batches)]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Reducers must be deterministic and invariant to batching</li>
<li>A full snapshot is stored every 1,000 updates (<code>snapshot_frequency</code>) or 5,000 supersteps</li>
<li>Delta storage does not shorten the model's context</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="23" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="23" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="long-term-memory">Long-Term Memory</h1>
<ul>
<li>A Store keeps application data across threads</li>
<li>Namespace tuples group documents ; keys identify individual documents</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">store </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> InMemoryStore</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">namespace </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"users"</span><span style="color:#212121">,</span><span style="color:#22863A"> "u1"</span><span style="color:#212121">,</span><span style="color:#22863A"> "profile"</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#24292EFF">store</span><span style="color:#212121">.</span><span style="color:#6F42C1">put</span><span style="color:#212121">(namespace, </span><span style="color:#22863A">"depot"</span><span style="color:#212121">, {</span><span style="color:#22863A">"text"</span><span style="color:#212121">: </span><span style="color:#22863A">"depot: Noord"</span><span style="color:#212121">})</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(store.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(namespace, </span><span style="color:#22863A">"depot"</span><span style="color:#212121">).value)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>put</code> with the same namespace and key replaces the document</li>
<li><code>search</code> retrieves up to 10 items (<code>limit</code>) within a namespace prefix</li>
<li>Labels cannot contain <code>.</code> : hash or encode an e-mail address used as a user id</li>
<li><code>delete</code> removes a document</li>
<li><code>runtime.store</code> and trusted runtime context scope a node's access</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">the-store</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="24" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="24" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="streaming-modes">Streaming Modes</h1>
<ul>
<li><code>stream_mode</code> chooses what a run emits :
<ul>
<li><code>values</code> emits accumulated state after each step</li>
<li><code>updates</code> emits node names and the updates they returned</li>
<li><code>messages</code> emits model message chunks with metadata</li>
<li><code>custom</code> emits application data through <code>get_stream_writer</code></li>
</ul>
</li>
<li>Streaming executes the graph while the caller consumes its output</li>
<li>Inspecting an existing checkpoint uses <code>get_state</code></li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> part </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> graph</span><span style="color:#212121">.</span><span style="color:#6F42C1">stream</span><span style="color:#212121">(inputs, config,</span></span>
<span class="line"><span style="color:#212121">                         stream_mode</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#22863A">"values"</span><span style="color:#212121">, </span><span style="color:#22863A">"updates"</span><span style="color:#212121">], version</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"v2"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(part[</span><span style="color:#22863A">"type"</span><span style="color:#212121">], part[</span><span style="color:#22863A">"data"</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">stream-modes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="25" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="25" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="debugging-state">Debugging State</h1>
<ul>
<li><code>debug</code> combines checkpoint and task events :
<ul>
<li>Checkpoint values and scheduled work</li>
<li>Task starts and completions, including results and errors</li>
</ul>
</li>
<li><code>checkpoints</code> and <code>tasks</code> select those event families separately</li>
<li>Checkpoint events require a checkpointer</li>
<li><code>updates</code> locates the node that wrote a value</li>
<li><code>values</code> shows the result after reducers merged updates</li>
<li>Studio provides a visual graph and state inspection interface</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="26" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="26" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="the-v2-stream-format">The v2 Stream Format</h1>
<ul>
<li><code>stream(..., version=&quot;v2&quot;)</code> emits a common dictionary format</li>
<li><code>type</code> selects the stream mode ; <code>data</code> holds its payload</li>
<li><code>ns</code> identifies the graph namespace</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> part </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> graph</span><span style="color:#212121">.</span><span style="color:#6F42C1">stream</span><span style="color:#212121">(inputs, config,</span></span>
<span class="line"><span style="color:#212121">                         stream_mode</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#22863A">"custom"</span><span style="color:#212121">, </span><span style="color:#22863A">"updates"</span><span style="color:#212121">], version</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"v2"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(part[</span><span style="color:#22863A">"type"</span><span style="color:#212121">], part[</span><span style="color:#22863A">"ns"</span><span style="color:#212121">], part[</span><span style="color:#22863A">"data"</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Root graph events use an empty namespace tuple</li>
<li>Values events also carry interrupt information</li>
<li>The default v1 format varies with modes and subgraph settings</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="27" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="27" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="v3-event-projections">v3 Event Projections</h1>
<ul>
<li><code>stream_events(..., version=&quot;v3&quot;)</code> returns a <code>GraphRunStream</code></li>
<li>Experimental on 1.2.17 ; the docs recommend it for new application code</li>
<li>Projections select typed views of one run :
<ul>
<li><code>values</code> yields state snapshots</li>
<li><code>messages</code>, <code>lifecycle</code> and <code>subgraphs</code> expose other views</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">run </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> small_graph</span><span style="color:#212121">.</span><span style="color:#6F42C1">stream_events</span><span style="color:#212121">({</span><span style="color:#22863A">"value"</span><span style="color:#212121">: </span><span style="color:#1976D2">0</span><span style="color:#212121">}, version</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"v3"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> state </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> run</span><span style="color:#212121">.</span><span style="color:#24292EFF">values</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(state)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(run.output)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Iteration drives the synchronous run without a background thread</li>
<li>v3 owns stream modes and subgraph streaming settings</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="28" data-paginate="true" data-class="default" data-theme="spiraltrain" lang="C" class="default" data-marpit-pagination="28" style="--paginate:true;--class:default;--theme:spiraltrain;" data-marpit-pagination-total="28" data-size="16:10">
<div class="ml-eyebrow"><a>State Management</a></div>
<h1 id="summary--state-management">Summary : State Management</h1>
<ul>
<li>Schemas define state fields and public graph interfaces</li>
<li>Reducers define how updates to each state key combine</li>
<li>Parallel writes need a merge policy or separate keys</li>
<li>Checkpointers retain thread state and scheduled continuation</li>
<li>Saved checkpoint configs select history for replay and forking</li>
<li>A Store keeps application memory across threads</li>
<li>Stream modes expose node updates and accumulated state</li>
<li>DeltaChannel is beta and v3 event streaming experimental on LangGraph 1.2.17</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise02</code><br><code class="pill-exercise pill-desc">State for Two Agents</code></p>
